<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de RPG | Deck e Dados</title>
<meta name="description" content="Mesa de RPG no Deck e Dados: o mestre narra, cada jogador responde quando puder. Dados rolados no servidor e a campanha toda salva. Grátis.">
<meta property="og:title" content="Mesa de RPG | Deck e Dados">
<meta property="og:description" content="Jogue RPG com seus amigos no seu tempo: cada um responde quando puder e nada se perde.">
<meta property="og:image" content="https://deckedados.com.br/og-image.jpg">
<meta property="og:url" content="https://deckedados.com.br/mesa.html">
<link rel="icon" href="/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* Mesa de RPG: o feltro do Deck e Dados vira mesa de jogo. Narração em pergaminho, ações dos personagens em cartas, rolagens em fichas de dado. */
:root{
  --felt:#132c2a; --felt-2:#1b3a37; --felt-3:#234845; --ink:#f1ede2; --ink-2:#a9bab5; --rule:rgba(241,237,226,0.14);
  --gold:#c9a24b; --gold-dim:#8a7134; --ok:#7cc59e; --red:#d96b5f; --whisper:#b79be8;
  --parch:#efe4c8; --parch-ink:#2b2216;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", "Courier New", monospace;
  --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--felt);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;
  background-image:radial-gradient(circle at 15% 0%,rgba(201,162,75,0.08),transparent 45%),radial-gradient(circle at 90% 10%,rgba(179,58,58,0.08),transparent 40%)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--rule)}
.site-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.05rem}
.site-brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.site-links{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--ui);font-size:.85rem;color:var(--ink-2)}
.site-links b{color:var(--ink);font-weight:600}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.pips{display:inline-flex;gap:4px}.pip{width:6px;height:6px;border-radius:50%;background:var(--gold)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 12px}
.intro{padding-block:44px 30px;max-width:64ch}
.intro p{margin:0;color:var(--ink-2);font-size:1.1rem}
.how{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.how span::before{content:"◆";color:var(--gold-dim);margin-right:8px;font-size:.7em;vertical-align:.15em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:var(--felt);border:1px solid var(--gold);padding:10px 20px;border-radius:6px;font-family:var(--ui);font-weight:700;font-size:.92rem;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--gold-dim)}
.btn.small{padding:6px 12px;font-size:.8rem;font-weight:600}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.chip{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.chip.gold{color:var(--gold)} .chip.ok{color:var(--ok)} .chip.red{color:var(--red)} .chip.mute{color:var(--ink-2)}
.card{border:1px solid var(--gold-dim);border-radius:10px;background:rgba(27,58,55,0.55);padding:20px}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--ui);font-size:.82rem;color:var(--ink-2);margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(10,24,23,.6);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;font-family:var(--ui);font-size:.95rem}
textarea{font-family:var(--body);font-size:1.02rem;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.muted{color:var(--ink-2)}
.err{color:var(--red);font-family:var(--ui);font-size:.85rem;min-height:1.2em;margin:4px 0 0}

/* lobby */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{display:block;text-decoration:none;border:1px solid var(--gold-dim);border-radius:10px;padding:18px;background:rgba(27,58,55,.55);transition:transform .15s,border-color .15s;position:relative}
.mcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.mcard h3{font-family:var(--display);font-size:1.45rem;margin:4px 0 6px;line-height:1.1}
.mcard .sys{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mcard .meta{font-family:var(--ui);font-size:.82rem;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mcard .vez{margin-top:12px;font-family:var(--ui);font-weight:700;font-size:.85rem;color:var(--felt);background:var(--gold);border-radius:6px;padding:6px 10px;display:inline-block}
.badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-family:var(--ui);font-weight:700;font-size:.75rem;border-radius:12px;padding:2px 8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
.steps div{border-top:2px solid var(--gold-dim);padding-top:10px;font-size:.98rem;color:var(--ink-2)}
.steps b{display:block;color:var(--ink);font-family:var(--display);font-size:1.1rem}

/* mesa */
.mhead{padding-block:22px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.mhead h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:4px 0 6px}
.mhead .meta{font-family:var(--ui);font-size:.85rem;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{font-family:var(--ui);font-size:.85rem;color:var(--ink-2);text-decoration:none}
.admstats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.admstats div{border:1px solid var(--gold-dim);border-radius:8px;padding:8px 14px;font-family:var(--ui);font-size:.8rem;color:var(--ink-2);text-align:center;min-width:90px}
.admstats b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--gold);line-height:1.1}
.admfil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.admfil input{flex:1;min-width:200px}
.admtab{overflow-x:auto;border:1px solid var(--gold-dim);border-radius:10px}
.admtab table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:.88rem}
.admtab th,.admtab td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
.admtab th{color:var(--gold);font-weight:600}
.banner{margin:14px 0 0;padding:12px 16px;border-radius:8px;font-family:var(--ui);font-size:.92rem;display:flex;gap:10px;align-items:center}
.banner.turn{background:var(--gold);color:var(--felt);font-weight:700}
.banner.info{border:1px dashed var(--rule);color:var(--ink-2)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;margin-top:20px;align-items:start}
.feed{display:flex;flex-direction:column;gap:12px}
.more{align-self:center}
.post{position:relative}
.post .tools{position:absolute;top:6px;right:8px;display:none;gap:4px}
.post:hover .tools,.post:focus-within .tools{display:flex}
.tools button{background:rgba(0,0,0,.35);border:0;color:var(--ink);border-radius:4px;font-size:.75rem;padding:2px 6px;cursor:pointer}
.by{font-family:var(--ui);font-size:.78rem;color:var(--ink-2);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.by b{color:var(--ink);font-size:.9rem}
.tx{white-space:normal;overflow-wrap:anywhere}
.p-sys{text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-2);letter-spacing:.05em}
.p-cena{text-align:center;padding:18px 0 6px}
.p-cena .orn{font-family:var(--mono);font-size:.7rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.p-cena h3{font-family:var(--display);font-size:1.7rem;margin:4px 0;line-height:1.1}
.p-cena .tx{color:var(--ink-2);font-style:italic;max-width:60ch;margin:0 auto}
.p-narr{background:var(--parch);color:var(--parch-ink);border-radius:4px 10px 10px 4px;padding:16px 20px;box-shadow:inset 5px 0 0 var(--gold-dim),0 6px 18px rgba(0,0,0,.25)}
.p-narr .by{color:#6b5a3c}.p-narr .by b{color:var(--parch-ink)}
.p-narr .tools button{background:rgba(0,0,0,.12);color:var(--parch-ink)}
.p-pc{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:rgba(27,58,55,.45)}
.p-pc.mine{border-color:var(--gold-dim)}
.p-pc .tx.acao{font-style:italic}
.p-pc .tx.fala::before{content:"“";color:var(--gold)} .p-pc .tx.fala::after{content:"”";color:var(--gold)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--felt-3);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--gold);border:1px solid var(--gold-dim);font-size:1.1rem;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.p-ooc{font-family:var(--ui);font-size:.86rem;color:var(--ink-2);padding:4px 10px;border-left:2px solid var(--rule)}
.p-ooc b{color:var(--ink)}
.p-roll{display:flex;gap:12px;align-items:center;border:1px dashed var(--gold-dim);border-radius:10px;padding:10px 14px;font-family:var(--ui);font-size:.9rem;background:rgba(10,24,23,.35)}
.p-roll .tot{font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--gold);min-width:48px;text-align:center;line-height:1}
.p-roll .dice{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.p-roll .d{font-family:var(--mono);font-size:.8rem;border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.p-roll .d.max{border-color:var(--ok);color:var(--ok)} .p-roll .d.min{border-color:var(--red);color:var(--red)}
.p-roll code{font-family:var(--mono);color:var(--ink)}
.whisper{outline:1px dashed var(--whisper);outline-offset:3px;border-radius:10px}
.wlabel{font-family:var(--ui);font-size:.72rem;color:var(--whisper);font-weight:600;margin-bottom:4px}
.edited{font-style:italic;opacity:.7}
.unread{display:flex;align-items:center;gap:10px;color:var(--red);font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.unread::before,.unread::after{content:"";flex:1;height:1px;background:var(--red)}
.empty{color:var(--ink-2);text-align:center;padding:30px 0;font-style:italic}

.composer{margin-top:18px;border:1px solid var(--gold-dim);border-radius:10px;background:rgba(10,24,23,.55);padding:12px}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ctabs button{background:transparent;border:1px solid var(--rule);color:var(--ink-2);border-radius:20px;padding:5px 12px;font-family:var(--ui);font-size:.82rem;cursor:pointer}
.ctabs button.on{background:var(--gold);color:var(--felt);border-color:var(--gold);font-weight:700}
.crow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.crow input,.crow select{flex:1;min-width:150px}
.composer textarea{width:100%;min-height:96px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.cfoot small{font-family:var(--ui);font-size:.75rem;color:var(--ink-2)}
.dicebtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dicebtns button{background:var(--felt-3);border:1px solid var(--gold-dim);color:var(--ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-weight:500;cursor:pointer;min-width:58px}
.dicebtns button:hover{border-color:var(--gold);color:var(--gold)}
.chk{display:flex;gap:6px;align-items:center;font-family:var(--ui);font-size:.85rem;color:var(--ink-2)}
.closed{font-family:var(--ui);font-size:.9rem;color:var(--ink-2);text-align:center;padding:12px}

.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.side section{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:rgba(27,58,55,.45)}
.side h3{font-family:var(--display);font-size:1.1rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side h3 button{font-size:.72rem}
.resumo{font-size:.95rem;max-height:260px;overflow:auto;color:var(--ink)}
.pcs{display:flex;flex-direction:column;gap:10px}
.pcl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.pcl .av{width:36px;height:36px;font-size:.95rem}
.pcl b{display:block;font-size:.98rem;line-height:1.15}
.pcl small{font-family:var(--ui);font-size:.75rem;color:var(--ink-2)}
.hp{height:5px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;margin-top:4px}.hp i{display:block;height:100%;background:var(--ok)}
.hp i.low{background:var(--red)}
.code{font-family:var(--mono);font-size:1.6rem;letter-spacing:.2em;color:var(--gold);text-align:center;margin:4px 0 10px}
.wait{display:flex;flex-direction:column;gap:6px;font-family:var(--ui);font-size:.88rem}
.wait label{display:flex;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.newpill{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:var(--felt);font-family:var(--ui);font-weight:700;border:0;border-radius:20px;padding:8px 16px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;z-index:20}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--felt-2);border:1px solid var(--gold-dim);border-radius:12px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}
.dlg h2{margin-bottom:14px}
.dlg textarea{width:100%;min-height:180px}
.dlg .row{display:flex;gap:10px}.dlg .row>*{flex:1}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#0d1f1e;border:1px solid var(--gold-dim);color:var(--ink);font-family:var(--ui);font-size:.88rem;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;min-width:0}
.fgrid .full,.fgrid .attrs,.fgrid .dotgrid,.fgrid .pers,.fgrid .fsub,.fgrid .gen{grid-column:1/-1}
.fhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fhead select{flex:1;min-width:200px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fsteps{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.fsteps button{background:transparent;border:1px solid var(--rule);color:var(--ink-2);border-radius:16px;padding:4px 10px;font-family:var(--ui);font-size:.78rem;cursor:pointer}
.fsteps button.done{border-color:var(--ok);color:var(--ok)}
.fsteps button.on{background:var(--gold);color:var(--felt);border-color:var(--gold);font-weight:700}
.fhelp{border-left:3px solid var(--gold);background:rgba(201,162,75,.08);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-family:var(--ui);font-size:.88rem;line-height:1.55}
.fhelp > b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--gold);margin-bottom:4px}
.fhelp small{color:var(--ink-2)}
.fsub{font-family:var(--ui);font-size:.8rem;color:var(--ink-2);margin:4px 0 6px}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:10px}
.attr{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--gold-dim);border-radius:8px;padding:8px 6px;background:rgba(10,24,23,.5)}
.attr span{font-family:var(--ui);font-size:.72rem;color:var(--ink-2);text-align:center}
.attr input{width:70px!important;text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:800;padding:4px}
.dotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px;margin-bottom:10px}
.dotrow{display:grid;grid-template-columns:minmax(0,1fr) 54px 74px;gap:6px;align-items:center;font-family:var(--ui);font-size:.85rem;margin:3px 0}
.dotrow input{padding:3px 4px;text-align:center}
.dotrow em{font-style:normal;color:var(--gold);letter-spacing:1px;font-size:.8rem}
.gen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.calcrow{display:flex;gap:6px;align-items:center}
.calcrow b{width:22px;text-align:center}.calcrow b.okm{color:var(--ok)}.calcrow b.warn{color:var(--gold)}
.dica{font-family:var(--ui);font-size:.72rem;color:var(--ink-2)}
.pers{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;font-family:var(--ui);font-size:.85rem;margin-bottom:12px}
.pers label{display:flex;gap:6px;align-items:center}
.fchk{list-style:none;padding:10px 12px;margin:4px 0 10px;border:1px dashed var(--rule);border-radius:8px;font-family:var(--ui);font-size:.85rem;display:flex;flex-direction:column;gap:4px}
.fchk li{color:var(--gold)}.fchk li.ok{color:var(--ok)}.fchk small{color:var(--ink-2)}
.ftop{position:sticky;top:-20px;z-index:2;background:var(--felt-2,#16302e);padding:8px 0;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--rule)}
.ftop .fsteps{margin:0;flex-basis:100%}
.fsec{border:1px solid var(--rule);border-radius:10px;padding:12px 14px 4px;margin:12px 0;scroll-margin-top:110px}
.fsech{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.fsech h3{margin:0;font-family:var(--display);font-size:1.1rem;color:var(--gold)}
.fsech h3 span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);font-size:.8rem;margin-right:4px}
.fnav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-family:var(--ui);font-size:.82rem;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:-1}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.mcard{transition:none}}
</style>
</head>

async function carregarAnteriores(){
  const prim=S.posts[0]; if(!prim) return; const y=document.documentElement.scrollHeight;
  const {data}=await sb.from('rpg_posts').select('*').eq('mesa_id',S.mesa.id).lt('id',prim.id).order('id',{ascending:false}).limit(PAGE);
  S.posts=(data||[]).reverse().concat(S.posts); S.hasMore=(data||[]).length===PAGE; renderFeed();
  window.scrollBy(0,document.documentElement.scrollHeight-y);
}

async function enviar(){
  const t=$('#cTxt'), txt=t.value.trim(), mestre=souMestre(), m=S.mesa, eu=membro(me.id)||{}; if(!txt) return t.focus();
  const tab=S.tab; let tipo=tab, para=null, per=eu.personagem||'';
  if(tab==='sussurro'){ tipo=mestre?'narracao':'acao'; para=mestre?($('#cPara')||{}).value:m.mestre_id; if(!para){ $('#cErr').textContent='Ainda não há jogadores na mesa.'; return; } }
  if(tab==='fala'&&mestre){ per=($('#cNpc').value.trim()||'NPC'); }
  if(mestre&&(tipo==='narracao'||tipo==='cena')) per='Mestre';
  const b=$('#bEnviar'); b.disabled=true; $('#cErr').textContent='';
  const {data,error}=await sb.from('rpg_posts').insert({mesa_id:m.id,autor_id:me.id,tipo,personagem:per,texto:txt,para_id:para}).select().single();
  b.disabled=false;
  if(error){ $('#cErr').textContent=errMsg(error); return; }
  t.value=''; try{ localStorage.removeItem(draftKey()); }catch(e){}
  addPosts([data],true); if(!mestre) atualizarMesa();
}
async function rolar(){
  const eu=membro(me.id)||{}, b=$('#bRolar'); b.disabled=true; $('#cErr').textContent='';

}

const sysDaMesa=()=>{ const s=(S.mesa&&S.mesa.sistema)||''; for(const [k,f] of Object.entries(SYS)) if(f.match.test(s)) return k; return 'livre'; };
function lerFicha(x){ const t=(x&&x.ficha)||''; if(t.startsWith('{"_ficha"')){ try{ const o=JSON.parse(t); o.c=o.c||{}; return o; }catch(e){} } return {_ficha:2, sys:null, c:t?{hist:t}:{}}; }
function pendencias(o){ const T=SYS[o.sys||sysDaMesa()]; if(!T) return 0; let n=0; T.passos.forEach(p=>{ try{ p.checks(o.c).forEach(ch=>{ if(!ch[1]) n++; }); }catch(e){} }); return n; }
function resumoFicha(x){ if(!x.ficha) return ''; const o=lerFicha(x), T=SYS[o.sys||sysDaMesa()]; try{ return T&&T.resumo?T.resumo(o.c):''; }catch(e){ return ''; } }
function ficha(uid,passo){
  const x=membro(uid); if(!x) return; const pode=uid===me.id||souMestre()||S.obs; const dis=pode?'':'disabled';
  const o=lerFicha(x); let sys=(o.sys&&SYS[o.sys])?o.sys:sysDaMesa(); let c=o.c;
  const ov=dialog(`<h2 style="margin-bottom:6px">${esc(x.personagem||nomeJog(uid))}</h2><div id="fBody"></div>`, pode?salvar:null, 'Salvar ficha');
  ov.querySelector('.dlg').style.width='min(820px,100%)';
  const optsOf=f=>typeof f.sel==='function'?f.sel(c):f.sel;
  function campo(f){
    if(f.rolar){ if(!pode||(f.rolar.quando&&!f.rolar.quando(c))) return ''; return `<div class="gen"><button type="button" class="btn ghost small" data-rolar="${SYS[sys].passos.findIndex(p=>p.campos.includes(f))}">🎲 Rolar na mesa (todos veem os dados)</button><span class="muted" id="genMsg" style="font-family:var(--ui);font-size:.8rem"></span></div>`; }
    if(f.attrs) return `<div class="fsub">${esc(f.l)}</div><div class="attrs">${f.lista.map(([k,l])=>`<label class="attr"><span>${esc(l)}</span><input data-g="${f.attrs}" data-gk="${esc(k)}" type="number" value="${esc((c[f.attrs]||{})[k]??'')}" ${dis}></label>`).join('')}</div>`;
    if(f.dots){ const g=c[f.dots]||{}; const row=([k,l])=>`<label class="dotrow"><span>${esc(l)}</span><input data-g="${f.dots}" data-gk="${esc(k)}" type="number" min="${f.min??1}" max="${f.max}" value="${esc(g[k]??'')}" ${dis}><em data-dot>${'●'.repeat(Math.max(0,Math.min(f.max,n0(g[k])||0)))}${'○'.repeat(Math.max(0,f.max-Math.min(f.max,n0(g[k])||0)))}</em></label>`;
      return f.grupos?`<div class="dotgrid">${f.grupos.map(([t,a,b])=>`<div><div class="fsub">${esc(t)}</div>${f.lista.slice(a,b).map(row).join('')}</div>`).join('')}</div>`:`<div class="dotgrid"><div>${f.lista.map(row).join('')}</div></div>`; }
    if(f.multi){ const sel=c[f.k]||[]; return `<div class="fsub">${esc(f.l)}</div><div class="pers">${f.multi(c).map(v=>`<label><input type="checkbox" data-m="${f.k}" value="${esc(v)}" ${sel.includes(v)?'checked':''} ${dis}> ${esc(v)}</label>`).join('')}</div>`; }
    const v=c[f.k]??f.d??'';
    if(f.sel){ const op=optsOf(f); return `<label class="f">${esc(f.l)}<select data-k="${f.k}" ${dis}><option value="">—</option>${op.map(s=>`<option ${s===v?'selected':''}>${esc(s)}</option>`).join('')}${v&&!op.includes(v)?`<option selected>${esc(v)}</option>`:''}</select></label>`; }
    if(f.area) return `<label class="f full">${esc(f.l)}<textarea data-k="${f.k}" maxlength="1500" style="min-height:70px" ${dis}>${esc(v)}</textarea></label>`;
    if(f.calc){ const e=f.calc(c), ok=f.txt?String(v).trim()===String(e):eqN(v,e); return `<label class="f">${esc(f.l)}<span class="calcrow"><input data-k="${f.k}" ${f.txt?'':'type="number"'} value="${esc(v)}" ${dis}><b data-cm="${f.k}" class="${v===''||e===null?'':ok?'okm':'warn'}" title="${esc(f.dica)}">${v===''||e===null?'':ok?'✔':'⚠'}</b></span><small class="dica">${esc(f.dica)}</small></label>`; }
    return `<label class="f">${esc(f.l)}<input data-k="${f.k}" ${f.n?'type="number"':`maxlength="${f.ml||80}"`} value="${esc(v)}" ${dis}></label>`;
  }
  const ajuda=new Set(); let todasAjudas=!x.ficha&&pode;
  function desenhar(){
    const T=SYS[sys]; const dlg=ov.querySelector('.dlg'); const top=dlg?dlg.scrollTop:0;
    ov.querySelector('#fBody').innerHTML=`
      <div class="fhead">${pode?`<select id="fSys" aria-label="Modelo de ficha">${Object.entries(SYS).map(([k,f])=>`<option value="${k}" ${k===sys?'selected':''}>${esc(f.nome)}${k===sysDaMesa()?' (sistema da mesa)':''}</option>`).join('')}</select>`:`<span class="muted" style="font-family:var(--ui);font-size:.85rem">${esc(T.nome)} · jogador: ${esc(nomeJog(uid))}</span>`}
        <label class="f" style="margin:0;flex:1;min-width:180px"><span class="sr">Nome</span><input id="fNome" maxlength="60" value="${esc(x._nome??x.personagem)}" placeholder="Nome do personagem" ${dis}></label>
        <label class="f" style="margin:0;width:110px">PV atuais<input id="fPa" type="number" value="${esc(x._pa??x.pv_atual??'')}" ${dis}></label></div>
      <div class="ftop"><ol class="fsteps" id="fSteps"></ol>
        ${pode?`<button type="button" class="btn ghost small" id="fAjudaTodas">${todasAjudas?'🙈 Esconder ajudas':'💡 Mostrar todas as ajudas'}</button>`:''}<span class="muted" id="fProg" style="font-family:var(--ui);font-size:.8rem"></span></div>
      ${T.passos.map((P,i)=>`<section class="fsec" id="fSec${i}">
        <div class="fsech"><h3><span>${i+1}</span> ${esc(P.t)}</h3>${pode?`<button type="button" class="btn ghost small" data-ajuda="${i}" aria-expanded="${todasAjudas||ajuda.has(i)}">💡 Ajuda</button>`:''}</div>
        ${pode&&(todasAjudas||ajuda.has(i))?`<div class="fhelp">${P.help(c)}</div>`:''}
        <div class="fgrid">${P.campos.map(campo).join('')}</div>
        ${pode?`<div data-chk="${i}"></div>`:''}</section>`).join('')}`;
    const B=ov.querySelector('#fBody');
    if(pode){
      B.querySelector('#fSys').onchange=e=>{ coletar(); if(Object.keys(c).length>1&&!confirm('Trocar o modelo apaga o que foi preenchido nesta ficha. Continuar?')){ e.target.value=sys; return; } sys=e.target.value; c={}; desenhar(); };
      B.querySelector('#fAjudaTodas').onclick=()=>{ coletar(); todasAjudas=!todasAjudas; ajuda.clear(); desenhar(); };
      B.querySelectorAll('[data-ajuda]').forEach(b=>b.onclick=()=>{ coletar(); const i=+b.dataset.ajuda; if(todasAjudas){ todasAjudas=false; T.passos.forEach((_,j)=>j!==i&&ajuda.add(j)); } else if(ajuda.has(i)) ajuda.delete(i); else ajuda.add(i); desenhar(); });
    }
    B.querySelectorAll('select[data-k]').forEach(s=>s.onchange=()=>{ coletar(); desenhar(); });
    B.querySelectorAll('input,textarea').forEach(i=>{ if(i.id==='fNome'||i.id==='fPa') return; i.addEventListener('input',()=>{ coletar(); conferir(); }); });
    B.querySelectorAll('[data-rolar]').forEach(rb=>rb.onclick=()=>rolarNaMesa(T.passos[+rb.dataset.rolar].campos.find(f=>f.rolar).rolar,rb));
    conferir(); if(dlg) dlg.scrollTop=top;
  }
  /* atualiza só a conferência (sem redesenhar os campos, para não perder o foco de quem está digitando) */
  function conferir(){ const B=ov.querySelector('#fBody'), T=SYS[sys];
    const cks=T.passos.map(p=>{ try{ return p.checks(c); }catch(e){ return [['Complete os itens anteriores',false]]; } });
    const st=cks.map(l=>l.every(ch=>ch[1]));
    B.querySelector('#fSteps').innerHTML=T.passos.map((p,i)=>`<li><button type="button" data-step="${i}" class="${st[i]?'done':''}">${st[i]?'✔':i+1}. ${esc(p.t)}</button></li>`).join('');
    B.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const sec=B.querySelector('#fSec'+b.dataset.step); if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'}); });
    B.querySelectorAll('[data-chk]').forEach(d=>{ const chs=cks[+d.dataset.chk]; d.innerHTML=chs.length?`<ul class="fchk">${chs.map(([l,ok,dd])=>`<li class="${ok?'ok':''}">${ok?'✔':'⚠'} ${esc(l)}${!ok&&dd?` <small>· ${esc(dd)}</small>`:''}</li>`).join('')}</ul>`:''; });
    B.querySelector('#fProg').textContent=pode?`${st.filter(Boolean).length} de ${T.passos.length} partes conferidas`:'';
    T.passos.forEach(P=>P.campos.forEach(f=>{ if(!f.calc) return; const m=B.querySelector(`[data-cm="${f.k}"]`); if(!m) return; const v=c[f.k]??'', e=f.calc(c), ok=f.txt?String(v).trim()===String(e):eqN(v,e); m.className=v===''||e===null?'':ok?'okm':'warn'; m.textContent=v===''||e===null?'':ok?'✔':'⚠'; }));
    B.querySelectorAll('[data-dot]').forEach(em=>{ const i=em.previousElementSibling, mx=+i.max, n=Math.max(0,Math.min(mx,n0(i.value)||0)); em.textContent='●'.repeat(n)+'○'.repeat(mx-n); });
  }
  function coletar(){ const B=ov.querySelector('#fBody'); if(!B) return;
    const nm=B.querySelector('#fNome'); if(nm) x._nome=nm.value;
    B.querySelectorAll('[data-k]').forEach(i=>c[i.dataset.k]=i.value);
    B.querySelectorAll('[data-g]').forEach(i=>{ (c[i.dataset.g]=c[i.dataset.g]||{})[i.dataset.gk]=i.value===''?'':+i.value; });
    const ms={}; B.querySelectorAll('[data-m]').forEach(i=>{ ms[i.dataset.m]=ms[i.dataset.m]||[]; if(i.checked) ms[i.dataset.m].push(i.value); }); Object.assign(c,ms);
    const pa=B.querySelector('#fPa'); if(pa) x._pa=pa.value; }
  async function rolarNaMesa(r,btn){ const msg=ov.querySelector('#genMsg');
    if(S.mesa.status!=='ativa'){ msg.textContent='A mesa precisa estar ativa para rolar.'; return; }
    btn.disabled=true; msg.textContent='Rolando na mesa…'; const per=x.personagem||nomeJog(uid);
    try{
      const um=async(expr,mot)=>{ const {data:id,error}=await sb.rpc('rpg_rolar',{p_mesa:S.mesa.id,p_expr:expr,p_motivo:mot,p_personagem:per,p_secreta:false}); if(error) throw error; const {data:p}=await sb.from('rpg_posts').select('*').eq('id',id).maybeSingle(); return p&&p.rolagem; };
      if(r.coc){ const out={}; for(const [k,l,e] of COC_AT){ const g=await um(e,`Criação: ${l} (${e} × 5)`); out[k]=g.total*5; } c.rolCoc=out; msg.textContent='✔ Rolado. Anote cada valor na sua característica.'; }
      else { const out=[]; for(let i=0;i<r.vezes;i++){ const g=await um(r.expr,`Criação: atributo ${i+1} de ${r.vezes} (${r.expr}${r.tira?', tira o menor':''})`); const ds=[...g.dados].sort((a,b)=>a-b); out.push(ds.slice(r.tira||0).reduce((s,d)=>s+d,0)); } c[r.alvo]=out; msg.textContent='✔ Rolado. Agora distribua esses valores nos atributos.'; }
      buscarNovos(false); desenhar();
    }catch(e){ msg.textContent=errMsg(e); btn.disabled=false; } }
  async function salvar(ovl){ coletar(); const T=SYS[sys]; const n=v=>v===''||v===undefined||v===null||isNaN(+v)?null:Math.trunc(+v);
    const nome=(x._nome??x.personagem??'').trim(); if(!nome) throw new Error('Dê um nome ao personagem (no topo da ficha).');
    const pvm=n(T.pv(c)); const pa=x._pa!==undefined?n(x._pa):x.pv_atual;
    const v={personagem:nome,ficha:JSON.stringify({_ficha:2,sys,c}),pv_max:pvm,pv_atual:pa===null&&pvm!==null?pvm:pa};
    if(v.ficha.length>6000) throw new Error('A ficha ficou grande demais. Encurte os textos.');
    const {error}=await sb.from('rpg_membros').update(v).eq('mesa_id',S.mesa.id).eq('user_id',uid); if(error) throw error;
    Object.assign(x,v); delete x._nome; delete x._pa; renderSide(); renderComposer(); toast(pendencias({sys,c})?`Ficha salva. Ainda há ${pendencias({sys,c})} item(ns) para conferir.`:'Ficha salva e conferida! ✔'); }
  desenhar();
}

/* ---------- tempo real, novidades e "lido" ---------- */
function addPosts(list,mineScroll){
  let novos=0; list.forEach(p=>{ const i=S.posts.findIndex(x=>x.id===p.id); if(i>=0) S.posts[i]=p; else { S.posts.push(p); if(p.autor_id!==me.id) novos++; } });
  S.posts.sort((a,b)=>a.id-b.id);
  const perto=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-260;
  renderFeed();
  if(mineScroll||perto){ const c=$('#composer'); c&&c.scrollIntoView({block:'end'}); }
  else if(novos){ S.unseen+=novos; pill(); }
  if(novos){ if(document.hidden){ S.titleCount=(S.titleCount||0)+novos; document.title=`(${S.titleCount}) ${S.mesa.nome} | Mesa de RPG`; } else marcarLido(); }
}
function pill(){ let b=$('#newpill'); if(!S.unseen){ b&&b.remove(); return; }
  if(!b){ b=document.createElement('button'); b.className='newpill'; b.id='newpill'; document.body.appendChild(b); b.onclick=()=>{ S.unseen=0; pill(); $('#composer').scrollIntoView({block:'end'}); }; }
  b.textContent=`↓ ${S.unseen} nova${S.unseen>1?'s':''} mensage${S.unseen>1?'ns':'m'}`; }
window.addEventListener('scroll',()=>{ if(S.unseen&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-260){ S.unseen=0; pill(); } },{passive:true});
async function buscarNovos(mine){
  const ult=S.posts.length?S.posts[S.posts.length-1].id:0;
  const {data}=await sb.from('rpg_posts').select('*').eq('mesa_id',S.mesa.id).gt('id',ult).order('id',{ascending:true});
  if(data&&data.length) addPosts(data,mine);
}
let tAtual=0;
function atualizarMesa(){ clearTimeout(tAtual); tAtual=setTimeout(async()=>{ const antes=JSON.stringify([S.mesa&&S.mesa.aguardando,S.mesa&&S.mesa.status,S.membros.map(m=>[m.personagem,m.pv_atual,m.pv_max])]);
  await carregarMesa(S.mesa.id); if(!S.mesa){ location.href='/mesa.html'; return; }
  const depois=JSON.stringify([S.mesa.aguardando,S.mesa.status,S.membros.map(m=>[m.personagem,m.pv_atual,m.pv_max])]);
  if(antes!==depois){ const ae=document.activeElement, emTexto=ae&&ae.id==='cTxt'; if(emTexto) renderSide(); else renderMesa(); } },800); }
let tLido=0;
function marcarLido(){ if(S.obs) return; clearTimeout(tLido); tLido=setTimeout(()=>{ sb.from('rpg_membros').update({ultimo_lido:new Date().toISOString()}).eq('mesa_id',S.mesa.id).eq('user_id',me.id).then(()=>{}); },1500); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.mesa){ S.titleCount=0; document.title=`${S.mesa.nome} | Mesa de RPG`; buscarNovos(false); atualizarMesa(); marcarLido(); } });
function conectarTempoReal(id){
  try{
    S.chan=sb.channel('mesa-'+id).on('postgres_changes',{event:'*',schema:'public',table:'rpg_posts',filter:'mesa_id=eq.'+id},pl=>{
      if(pl.eventType==='INSERT'){ addPosts([pl.new],false); atualizarMesa(); }
      else if(pl.eventType==='UPDATE'){ const i=S.posts.findIndex(x=>x.id===pl.new.id); if(i>=0){ S.posts[i]=pl.new; renderFeed(); } }
      else if(pl.eventType==='DELETE'){ const old=pl.old&&pl.old.id; if(old){ S.posts=S.posts.filter(x=>x.id!==old); renderFeed(); } }
    }).subscribe();
  }catch(e){}
  S.poll=setInterval(()=>{ if(!document.hidden){ buscarNovos(false); atualizarMesa(); } },25000);
}

start().catch(e=>{ console.error(e); $('#app').innerHTML=`<p class="empty">Erro ao carregar: ${esc(errMsg(e))}</p>`; });
})();
</script>
