<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Mesa de RPG | Deck e Dados</title>

<meta property="og:description" content="Jogue RPG com seus amigos no seu tempo: cada um responde quando puder e nada se perde.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* Mesa de RPG: o feltro do Deck e Dados vira mesa de jogo. Narração em pergaminho, ações dos personagens em cartas, rolagens em fichas de dado. */
:root{
  --felt:#132c2a; --felt-2:#1b3a37; --felt-3:#234845; --ink:#f1ede2; --ink-2:#a9bab5; --rule:rgba(241,237,226,0.14);
  --gold:#c9a24b; --gold-dim:#8a7134; --ok:#7cc59e; --red:#d96b5f; --whisper:#b79be8;
  --parch:#efe4c8; --parch-ink:#2b2216;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", "Courier New", monospace;
  --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--felt);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;
  background-image:radial-gradient(circle at 15% 0%,rgba(201,162,75,0.08),transparent 45%),radial-gradient(circle at 90% 10%,rgba(179,58,58,0.08),transparent 40%)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--rule)}
.site-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.05rem}
.site-brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.site-links{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--ui);font-size:.85rem;color:var(--ink-2)}
.site-links b{color:var(--ink);font-weight:600}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.pips{display:inline-flex;gap:4px}.pip{width:6px;height:6px;border-radius:50%;background:var(--gold)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 12px}
.intro{padding-block:44px 30px;max-width:64ch}
.intro p{margin:0;color:var(--ink-2);font-size:1.1rem}
.how{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.how span::before{content:"◆";color:var(--gold-dim);margin-right:8px;font-size:.7em;vertical-align:.15em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:var(--felt);border:1px solid var(--gold);padding:10px 20px;border-radius:6px;font-family:var(--ui);font-weight:700;font-size:.92rem;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--gold-dim)}
.btn.small{padding:6px 12px;font-size:.8rem;font-weight:600}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.chip{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.chip.gold{color:var(--gold)} .chip.ok{color:var(--ok)} .chip.red{color:var(--red)} .chip.mute{color:var(--ink-2)}
.card{border:1px solid var(--gold-dim);border-radius:10px;background:rgba(27,58,55,0.55);padding:20px}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--ui);font-size:.82rem;color:var(--ink-2);margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(10,24,23,.6);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;font-family:var(--ui);font-size:.95rem}
textarea{font-family:var(--body);font-size:1.02rem;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.muted{color:var(--ink-2)}
.err{color:var(--red);font-family:var(--ui);font-size:.85rem;min-height:1.2em;margin:4px 0 0}

/* lobby */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{display:block;text-decoration:none;border:1px solid var(--gold-dim);border-radius:10px;padding:18px;background:rgba(27,58,55,.55);transition:transform .15s,border-color .15s;position:relative}
.mcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.mcard h3{font-family:var(--display);font-size:1.45rem;margin:4px 0 6px;line-height:1.1}
.mcard .sys{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mcard .meta{font-family:var(--ui);font-size:.82rem;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mcard .vez{margin-top:12px;font-family:var(--ui);font-weight:700;font-size:.85rem;color:var(--felt);background:var(--gold);border-radius:6px;padding:6px 10px;display:inline-block}
.badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-family:var(--ui);font-weight:700;font-size:.75rem;border-radius:12px;padding:2px 8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
.steps div{border-top:2px solid var(--gold-dim);padding-top:10px;font-size:.98rem;color:var(--ink-2)}
.steps b{display:block;color:var(--ink);font-family:var(--display);font-size:1.1rem}

/* mesa */
.mhead{padding-block:22px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.mhead h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:4px 0 6px}
.mhead .meta{font-family:var(--ui);font-size:.85rem;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{font-family:var(--ui);font-size:.85rem;color:var(--ink-2);text-decoration:none}
.banner{margin:14px 0 0;padding:12px 16px;border-radius:8px;font-family:var(--ui);font-size:.92rem;display:flex;gap:10px;align-items:center}
.banner.turn{background:var(--gold);color:var(--felt);font-weight:700}
.banner.info{border:1px dashed var(--rule);color:var(--ink-2)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;margin-top:20px;align-items:start}
.feed{display:flex;flex-direction:column;gap:12px}
.more{align-self:center}
.post{position:relative}
.post .tools{position:absolute;top:6px;right:8px;display:none;gap:4px}
.post:hover .tools,.post:focus-within .tools{display:flex}
.tools button{background:rgba(0,0,0,.35);border:0;color:var(--ink);border-radius:4px;font-size:.75rem;padding:2px 6px;cursor:pointer}
.by{font-family:var(--ui);font-size:.78rem;color:var(--ink-2);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.by b{color:var(--ink);font-size:.9rem}
.tx{white-space:normal;overflow-wrap:anywhere}
.p-sys{text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-2);letter-spacing:.05em}
.p-cena{text-align:center;padding:18px 0 6px}
.p-cena .orn{font-family:var(--mono);font-size:.7rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.p-cena h3{font-family:var(--display);font-size:1.7rem;margin:4px 0;line-height:1.1}
.p-cena .tx{color:var(--ink-2);font-style:italic;max-width:60ch;margin:0 auto}
.p-narr{background:var(--parch);color:var(--parch-ink);border-radius:4px 10px 10px 4px;padding:16px 20px;box-shadow:inset 5px 0 0 var(--gold-dim),0 6px 18px rgba(0,0,0,.25)}
.p-narr .by{color:#6b5a3c}.p-narr .by b{color:var(--parch-ink)}
.p-narr .tools button{background:rgba(0,0,0,.12);color:var(--parch-ink)}
.p-pc{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:rgba(27,58,55,.45)}
.p-pc.mine{border-color:var(--gold-dim)}
.p-pc .tx.acao{font-style:italic}
.p-pc .tx.fala::before{content:"“";color:var(--gold)} .p-pc .tx.fala::after{content:"”";color:var(--gold)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--felt-3);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--gold);border:1px solid var(--gold-dim);font-size:1.1rem;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.p-ooc{font-family:var(--ui);font-size:.86rem;color:var(--ink-2);padding:4px 10px;border-left:2px solid var(--rule)}
.p-ooc b{color:var(--ink)}
.p-roll{display:flex;gap:12px;align-items:center;border:1px dashed var(--gold-dim);border-radius:10px;padding:10px 14px;font-family:var(--ui);font-size:.9rem;background:rgba(10,24,23,.35)}
.p-roll .tot{font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--gold);min-width:48px;text-align:center;line-height:1}
.p-roll .dice{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.p-roll .d{font-family:var(--mono);font-size:.8rem;border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.p-roll .d.max{border-color:var(--ok);color:var(--ok)} .p-roll .d.min{border-color:var(--red);color:var(--red)}
.p-roll code{font-family:var(--mono);color:var(--ink)}
.whisper{outline:1px dashed var(--whisper);outline-offset:3px;border-radius:10px}
.wlabel{font-family:var(--ui);font-size:.72rem;color:var(--whisper);font-weight:600;margin-bottom:4px}
.edited{font-style:italic;opacity:.7}
.unread{display:flex;align-items:center;gap:10px;color:var(--red);font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.unread::before,.unread::after{content:"";flex:1;height:1px;background:var(--red)}
.empty{color:var(--ink-2);text-align:center;padding:30px 0;font-style:italic}

.composer{margin-top:18px;border:1px solid var(--gold-dim);border-radius:10px;background:rgba(10,24,23,.55);padding:12px}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ctabs button{background:transparent;border:1px solid var(--rule);color:var(--ink-2);border-radius:20px;padding:5px 12px;font-family:var(--ui);font-size:.82rem;cursor:pointer}
.ctabs button.on{background:var(--gold);color:var(--felt);border-color:var(--gold);font-weight:700}
.crow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.crow input,.crow select{flex:1;min-width:150px}
.composer textarea{width:100%;min-height:96px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.cfoot small{font-family:var(--ui);font-size:.75rem;color:var(--ink-2)}
.dicebtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dicebtns button{background:var(--felt-3);border:1px solid var(--gold-dim);color:var(--ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-weight:500;cursor:pointer;min-width:58px}
.dicebtns button:hover{border-color:var(--gold);color:var(--gold)}
.chk{display:flex;gap:6px;align-items:center;font-family:var(--ui);font-size:.85rem;color:var(--ink-2)}
.closed{font-family:var(--ui);font-size:.9rem;color:var(--ink-2);text-align:center;padding:12px}

.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.side section{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:rgba(27,58,55,.45)}
.side h3{font-family:var(--display);font-size:1.1rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side h3 button{font-size:.72rem}
.resumo{font-size:.95rem;max-height:260px;overflow:auto;color:var(--ink)}
.pcs{display:flex;flex-direction:column;gap:10px}
.pcl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.pcl .av{width:36px;height:36px;font-size:.95rem}
.pcl b{display:block;font-size:.98rem;line-height:1.15}
.pcl small{font-family:var(--ui);font-size:.75rem;color:var(--ink-2)}
.hp{height:5px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;margin-top:4px}.hp i{display:block;height:100%;background:var(--ok)}
.hp i.low{background:var(--red)}
.code{font-family:var(--mono);font-size:1.6rem;letter-spacing:.2em;color:var(--gold);text-align:center;margin:4px 0 10px}
.wait{display:flex;flex-direction:column;gap:6px;font-family:var(--ui);font-size:.88rem}
.wait label{display:flex;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.newpill{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:var(--felt);font-family:var(--ui);font-weight:700;border:0;border-radius:20px;padding:8px 16px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;z-index:20}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--felt-2);border:1px solid var(--gold-dim);border-radius:12px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}
.dlg h2{margin-bottom:14px}
.dlg textarea{width:100%;min-height:180px}
.dlg .row{display:flex;gap:10px}.dlg .row>*{flex:1}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#0d1f1e;border:1px solid var(--gold-dim);color:var(--ink);font-family:var(--ui);font-size:.88rem;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-family:var(--ui);font-size:.82rem;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:-1}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.mcard{transition:none}}
</style>
</head>

</div>

<script>
(function(){
const SUPABASE_URL="https://baoquuhwoqftboziight.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhb3F1dWh3b3FmdGJvemlpZ2h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NTE1MjcsImV4cCI6MjEwMzAyNzUyN30.5ut-Gd9OWdy99sX2YnUQPimssfYCbtn0cLjBRERXO-w";
const SISTEMAS=['D&D 5e','Tormenta20','Ordem Paranormal','Call of Cthulhu','Vampiro: A Máscara','Pathfinder','3D&T','GURPS','Sistema próprio'];
const PAGE=120;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<i>$2</i>').replace(/\n/g,'<br>');
const params=new URLSearchParams(location.search);
let sb=null, me=null, myName='';
const S={ mesa:null, membros:[], prof:{}, posts:[], hasMore:false, prevLido:null, tab:null, chan:null, poll:null, unseen:0, firstLoad:true };

function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200); }
function quando(iso){ const t=Date.parse(iso); if(!t) return ''; const s=(Date.now()-t)/1000;
  if(s<60) return 'agora'; if(s<3600) return `há ${Math.floor(s/60)} min`; if(s<86400) return `há ${Math.floor(s/3600)} h`; const d=Math.floor(s/86400); return d===1?'ontem':`há ${d} dias`; }
const dataHora=iso=>new Date(iso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const errMsg=e=>(e&&(e.message||e.error_description))||'Algo deu errado. Tente de novo.';
function avatar(uid,nome){ const p=S.prof[uid]; if(p&&p.avatar) return `<span class="av"><img src="${esc(p.avatar)}" alt=""></span>`; return `<span class="av">${esc((nome||'?').trim().charAt(0).toUpperCase()||'?')}</span>`; }
const nomeJog=uid=>(S.prof[uid]&&S.prof[uid].name)||'Jogador';
const membro=uid=>S.membros.find(m=>m.user_id===uid);
const souMestre=()=>S.mesa&&me&&S.mesa.mestre_id===me.id;

/* ---------- janela de diálogo ---------- */
function dialog(html, onOk, okText='Salvar', extra){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}<p class="err" id="dErr"></p><div class="acts">${extra||''}<button class="btn ghost" data-x>Cancelar</button>${onOk?`<button class="btn" data-ok>${okText}</button>`:''}</div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov||e.target.closest('[data-x]')) close(); });
  if(onOk) ov.querySelector('[data-ok]').onclick=async()=>{ const b=ov.querySelector('[data-ok]'); b.disabled=true; try{ const r=await onOk(ov); if(r!==false) close(); }catch(e){ ov.querySelector('#dErr').textContent=errMsg(e); } b.disabled=false; };
  const f=ov.querySelector('input,textarea,select'); if(f) f.focus();
  return ov;
}
const confirmar=(txt,ok,okText='Confirmar')=>dialog(`<h2>Tem certeza?</h2><p>${txt}</p>`,ok,okText);

/* ---------- início ---------- */
async function start(){
  try{ if(window.supabase) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){}
  if(!sb){ $('#app').innerHTML='<p class="empty">Não foi possível conectar. Recarregue a página.</p>'; return; }
  const {data:{session}}=await sb.auth.getSession();
  me=session?session.user:null;
  if(me){ try{ const {data}=await sb.from('profiles').select('id,name,avatar').eq('id',me.id).maybeSingle(); if(data){ S.prof[me.id]=data; myName=data.name||''; } }catch(e){} }
  $('#conta').innerHTML=me?`Jogando como <b>${esc(myName||me.email||'você')}</b>`:'Sem conta · <a href="/">Entrar</a>';
  if(params.get('m')&&me) return abrirMesa(params.get('m'));
  lobby();
}

/* ---------- lobby ---------- */
async function lobby(){
  const conv=(params.get('convite')||'').toUpperCase();
  let mesas=[];
  if(me){ const {data,error}=await sb.rpc('rpg_minhas_mesas'); if(error) console.warn(error); mesas=data||[]; }
  $('#app').innerHTML=`
  <header class="intro">
    <p class="eyebrow"><span class="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></span>Mesa de RPG</p>
    <h1>Jogue no seu tempo</h1>

/* ---------- mesa ---------- */
async function carregarMesa(id){
  const [{data:mesa},{data:membros}]=await Promise.all([
    sb.from('rpg_mesas').select('*').eq('id',id).maybeSingle(),
    sb.from('rpg_membros').select('*').eq('mesa_id',id)
  ]);
  S.mesa=mesa; S.membros=(membros||[]).sort((a,b)=>(a.user_id===mesa?.mestre_id?-1:b.user_id===mesa?.mestre_id?1:Date.parse(a.entrou_em)-Date.parse(b.entrou_em)));
  const falta=S.membros.map(m=>m.user_id).filter(u=>!S.prof[u]);
  if(falta.length){ const {data}=await sb.from('profiles').select('id,name,avatar').in('id',falta); (data||[]).forEach(p=>S.prof[p.id]=p); }
}
async function abrirMesa(id){
  await carregarMesa(id);
  if(!S.mesa){ $('#app').innerHTML=`<div class="card" style="margin-top:30px"><h2>Mesa não encontrada</h2><p class="muted">Você não participa desta mesa, ou ela foi apagada. Peça o código de convite ao mestre.</p><a class="btn" href="/mesa.html">Ver minhas mesas</a></div>`; return; }
  const eu=membro(me.id); S.prevLido=eu?eu.ultimo_lido:null;
  S.tab=souMestre()?'narracao':'acao';
  const {data}=await sb.from('rpg_posts').select('*').eq('mesa_id',id).order('id',{ascending:false}).limit(PAGE);
  S.posts=(data||[]).reverse(); S.hasMore=(data||[]).length===PAGE;
  document.title=`${S.mesa.nome} | Mesa de RPG`;
  renderMesa(); marcarLido();
  conectarTempoReal(id);
}
function renderMesa(){
  const m=S.mesa, mestre=souMestre(), vez=(m.aguardando||[]).includes(me.id);
  $('#app').innerHTML=`
  <header class="mhead">
    <div><a class="back" href="/mesa.html">← Minhas mesas</a>
      <h1>${esc(m.nome)}</h1>
      <div class="meta"><span class="chip gold">${esc(m.sistema||'RPG')}</span>${m.status!=='ativa'?`<span class="chip ${m.status==='pausada'?'mute':'red'}">${esc(m.status)}</span>`:''}<span>Mestre: <b>${esc(nomeJog(m.mestre_id))}</b></span><span>· ${S.membros.length} na mesa</span></div>
    </div>
    ${m.descricao?`<p class="muted" style="max-width:52ch;margin:0;font-size:.95rem">${fmt(m.descricao)}</p>`:''}
  </header>
  ${vez&&m.status==='ativa'?'<div class="banner turn">⏳ O mestre está esperando a sua resposta.</div>':''}
  ${m.status==='pausada'?'<div class="banner info">⏸ A mesa está pausada pelo mestre. Dá para ler e conversar fora do jogo.</div>':''}
  ${m.status==='encerrada'?'<div class="banner info">🏁 Esta campanha foi encerrada. A história continua salva para ler.</div>':''}
  <div class="layout">
    <main>

    </main>

  renderFeed(); renderComposer(); renderSide();

function postHTML(p){
  const mine=p.autor_id===me.id, mestre=souMestre(), autorMestre=p.autor_id===S.mesa.mestre_id;
  const per=p.personagem||(membro(p.autor_id)||{}).personagem||nomeJog(p.autor_id);
  const t=`<span title="${esc(dataHora(p.criado_em))}">${quando(p.criado_em)}</span>${p.editado?' <span class="edited">(editado)</span>':''}`;
  const tools=(p.tipo!=='sistema')&&((mine&&p.tipo!=='rolagem')||mestre)?`<span class="tools">${mine&&p.tipo!=='rolagem'?`<button data-edit="${p.id}" title="Editar">✎</button>`:''}<button data-del="${p.id}" title="Apagar">🗑</button></span>`:'';
  let w='';
  if(p.para_id){ w=p.tipo==='rolagem'?'🤫 Rolagem secreta (só o mestre vê)':p.autor_id===S.mesa.mestre_id?`🤫 Sussurro do mestre para ${esc(nomeJog(p.para_id))}`:`🤫 Sussurro de ${esc(per)} para o mestre`; w=`<div class="wlabel">${w}</div>`; }
  let h='';
  if(p.tipo==='sistema') return `<div class="p-sys" data-id="${p.id}">— ${esc(p.texto)} · ${quando(p.criado_em)} —</div>`;
  if(p.tipo==='cena'){ const [tit,...rest]=String(p.texto).split('\n'); h=`<div class="p-cena"><div class="orn">✦ Nova cena ✦</div><h3>${fmt(tit)}</h3>${rest.join('\n').trim()?`<div class="tx">${fmt(rest.join('\n').trim())}</div>`:''}<div class="by" style="justify-content:center">${t}</div></div>`; }
  else if(p.tipo==='narracao') h=`<article class="p-narr">${w}<div class="by"><b>📜 ${esc(per&&per!=='Mestre'?per:'Mestre')}</b> · ${t}</div><div class="tx">${fmt(p.texto)}</div></article>`;
  else if(p.tipo==='acao'||p.tipo==='fala') h=`<article class="p-pc ${mine?'mine':''}">${avatar(p.autor_id,per)}<div>${w}<div class="by"><b>${esc(per)}</b><span>${autorMestre&&p.tipo==='fala'?'(NPC)':`(${esc(nomeJog(p.autor_id))})`}</span> · ${t}</div><div class="tx ${p.tipo}">${fmt(p.texto)}</div></div></article>`;
  else if(p.tipo==='ooc') h=`<div class="p-ooc">${w}☕ <b>${esc(nomeJog(p.autor_id))}</b> <span>(fora do jogo)</span>: ${fmt(p.texto)} · ${t}</div>`;
  else if(p.tipo==='rolagem'){ const r=p.rolagem||{}; const ds=(r.dados||[]).map(d=>`<span class="d ${d===r.faces?'max':d===1?'min':''}">${d}</span>`).join('');
    const crit=r.faces===20&&(r.dados||[]).length===1?(r.dados[0]===20?' <span class="chip ok">20 natural!</span>':r.dados[0]===1?' <span class="chip red">1 natural</span>':''):'';
    h=`<div class="p-roll"><span class="tot">${esc(r.total)}</span><div>${w}<div><b>${esc(per)}</b> rolou <code>${esc(r.expr)}</code>${p.texto?` · ${esc(p.texto)}`:''}${crit}</div><div class="by" style="margin:2px 0 0">dados:<span class="dice">${ds}</span>${r.mod?` ${r.mod>0?'+':''}${esc(r.mod)}`:''} · ${t}</div></div></div>`; }
  return `<div class="post ${p.para_id?'whisper':''}" data-id="${p.id}">${tools}${h}</div>`;
}
function renderFeed(){
  const f=$('#feed'); if(!f) return;
  const lido=S.prevLido?Date.parse(S.prevLido):0; let marcou=false;
  const html=S.posts.map(p=>{ let pre='';
    if(!marcou&&lido&&Date.parse(p.criado_em)>lido&&p.autor_id!==me.id&&p.tipo!=='sistema'){ marcou=true; pre='<div class="unread" id="unread">Novas desde a sua última visita</div>'; }
    return pre+postHTML(p); }).join('');
  f.innerHTML=(S.hasMore?'<button class="btn ghost small more" id="bMais">Carregar mensagens anteriores</button>':'')+(html||'<p class="empty">A mesa está pronta. O mestre começa a narrar quando quiser.</p>');
  if($('#bMais')) $('#bMais').onclick=carregarAnteriores;
  f.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>apagarPost(+b.dataset.del));
  f.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editarPost(+b.dataset.edit));
}
async function carregarAnteriores(){
  const prim=S.posts[0]; if(!prim) return; const y=document.documentElement.scrollHeight;
  const {data}=await sb.from('rpg_posts').select('*').eq('mesa_id',S.mesa.id).lt('id',prim.id).order('id',{ascending:false}).limit(PAGE);
  S.posts=(data||[]).reverse().concat(S.posts); S.hasMore=(data||[]).length===PAGE; renderFeed();
  window.scrollBy(0,document.documentElement.scrollHeight-y);
}

/* ---------- escrever ---------- */
const TABS_MESTRE=[['narracao','📜 Narração'],['cena','🎬 Nova cena'],['fala','💬 Fala de NPC'],['rolar','🎲 Rolar dados'],['sussurro','🤫 Sussurro'],['ooc','☕ Fora do jogo']];
const TABS_JOG=[['acao','🎭 Ação'],['fala','💬 Fala'],['rolar','🎲 Rolar dados'],['sussurro','🤫 Sussurro ao mestre'],['ooc','☕ Fora do jogo']];
const draftKey=()=>'mesa.rascunho.'+S.mesa.id;
function renderComposer(){
  const c=$('#composer'); if(!c) return; const m=S.mesa, mestre=souMestre(), eu=membro(me.id)||{};
  if(m.status==='encerrada'){ c.innerHTML='<div class="composer"><p class="closed">Campanha encerrada.</p></div>'; return; }
  const tabs=(mestre?TABS_MESTRE:TABS_JOG).filter(t=>m.status==='ativa'||t[0]==='ooc');
  if(!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  const tab=S.tab, jogadores=S.membros.filter(x=>x.user_id!==m.mestre_id);
  let rascunho=''; try{ rascunho=localStorage.getItem(draftKey())||''; }catch(e){}
  const ph={narracao:'Descreva o que acontece, o lugar, os sons, as consequências…',cena:'Título da cena na primeira linha.\nDepois, se quiser, uma descrição.',fala:mestre?'O que o NPC diz…':'O que o seu personagem diz…',acao:'O que o seu personagem faz…',ooc:'Recado fora do jogo: combinar horário, tirar dúvida de regra…',sussurro:mestre?'Algo que só esse jogador vai saber…':'Algo que só o mestre vai saber (uma ação escondida, uma pergunta)…'}[tab];
  c.innerHTML=`<div class="composer">
    <div class="ctabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>
    ${tab==='rolar'?`
      <div class="dicebtns">${['d4','d6','d8','d10','d12','d20','d100'].map(d=>`<button type="button" data-d="1${d}">${d}</button>`).join('')}</div>
      <div class="crow"><input id="rExpr" value="1d20" maxlength="12" aria-label="Dados" style="max-width:130px;font-family:var(--mono)"><input id="rMot" maxlength="300" placeholder="Para quê? Ex.: Ataque com espada"></div>
      <div class="cfoot"><label class="chk"><input type="checkbox" id="rSec"> Rolagem secreta (só o mestre vê)</label><button class="btn" id="bRolar">🎲 Rolar</button></div>
      <small class="muted" style="font-family:var(--ui);font-size:.75rem">Formatos: 1d20 · 2d6+3 · 4d6-1 · d100. Os dados são rolados no servidor: ninguém consegue escolher o resultado.</small>`:`
      ${tab==='fala'&&mestre?`<div class="crow"><input id="cNpc" maxlength="60" placeholder="Nome do NPC (ex.: Taverneiro Brom)"></div>`:''}
      ${tab==='sussurro'&&mestre?`<div class="crow"><select id="cPara">${jogadores.map(j=>`<option value="${esc(j.user_id)}">${esc(j.personagem||nomeJog(j.user_id))} (${esc(nomeJog(j.user_id))})</option>`).join('')}</select></div>`:''}
      ${(tab==='acao'||tab==='fala')&&!mestre?`<div class="by" style="margin-bottom:6px">Como <b>${esc(eu.personagem||'seu personagem')}</b></div>`:''}
      <textarea id="cTxt" maxlength="8000" placeholder="${esc(ph)}">${esc(rascunho)}</textarea>
      <div class="cfoot"><small>**negrito** · *itálico* · Ctrl+Enter envia · o rascunho fica salvo</small><button class="btn" id="bEnviar">Enviar</button></div>`}
    <p class="err" id="cErr"></p></div>`;
  c.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; renderComposer(); const t=$('#cTxt'); t&&t.focus(); });
  if(tab==='rolar'){
    c.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ $('#rExpr').value=b.dataset.d; rolar(); });
    $('#bRolar').onclick=rolar; $('#rMot').onkeydown=e=>{ if(e.key==='Enter') rolar(); };
  } else {
    const t=$('#cTxt'); t.oninput=()=>{ try{ localStorage.setItem(draftKey(),t.value); }catch(e){} };
    t.onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); enviar(); } };
    $('#bEnviar').onclick=enviar;
  }
}
async function enviar(){
  const t=$('#cTxt'), txt=t.value.trim(), mestre=souMestre(), m=S.mesa, eu=membro(me.id)||{}; if(!txt) return t.focus();
  const tab=S.tab; let tipo=tab, para=null, per=eu.personagem||'';
  if(tab==='sussurro'){ tipo=mestre?'narracao':'acao'; para=mestre?($('#cPara')||{}).value:m.mestre_id; if(!para){ $('#cErr').textContent='Ainda não há jogadores na mesa.'; return; } }
  if(tab==='fala'&&mestre){ per=($('#cNpc').value.trim()||'NPC'); }
  if(mestre&&(tipo==='narracao'||tipo==='cena')) per='Mestre';
  const b=$('#bEnviar'); b.disabled=true; $('#cErr').textContent='';
  const {data,error}=await sb.from('rpg_posts').insert({mesa_id:m.id,autor_id:me.id,tipo,personagem:per,texto:txt,para_id:para}).select().single();
  b.disabled=false;
  if(error){ $('#cErr').textContent=errMsg(error); return; }
  t.value=''; try{ localStorage.removeItem(draftKey()); }catch(e){}
  addPosts([data],true); if(!mestre) atualizarMesa();
}
async function rolar(){
  const eu=membro(me.id)||{}, b=$('#bRolar'); b.disabled=true; $('#cErr').textContent='';
  const {error}=await sb.rpc('rpg_rolar',{p_mesa:S.mesa.id,p_expr:$('#rExpr').value,p_motivo:$('#rMot').value.trim(),p_personagem:souMestre()?'Mestre':(eu.personagem||''),p_secreta:$('#rSec').checked});
  b.disabled=false; if(error){ $('#cErr').textContent=errMsg(error); return; }
  $('#rMot').value=''; await buscarNovos(true); atualizarMesa();
}
function editarPost(id){
  const p=S.posts.find(x=>x.id===id); if(!p) return;
  dialog(`<h2>Editar mensagem</h2><textarea id="eTxt" maxlength="8000">${esc(p.texto)}</textarea>`,async ov=>{
    const txt=ov.querySelector('#eTxt').value.trim(); if(!txt) throw new Error('A mensagem não pode ficar vazia.');
    const {error}=await sb.from('rpg_posts').update({texto:txt,editado:true}).eq('id',id); if(error) throw error;
    p.texto=txt; p.editado=true; renderFeed(); });
}
function apagarPost(id){
  confirmar('A mensagem será apagada para todos da mesa.',async()=>{ const {error}=await sb.from('rpg_posts').delete().eq('id',id); if(error) throw error; S.posts=S.posts.filter(x=>x.id!==id); renderFeed(); },'Apagar');
}

      return `<div class="pcl">${avatar(x.user_id,x.personagem)}<div><b>${esc(x.personagem||nomeJog(x.user_id))}</b><small>${x.user_id===m.mestre_id?'Mestre':esc(nomeJog(x.user_id))}${pv!==null?` · PV ${esc(x.pv_atual??x.pv_max)}/${esc(x.pv_max)}`:''}</small>${pv!==null?`<div class="hp"><i class="${pv<=25?'low':''}" style="width:${pv}%"></i></div>`:''}</div>
        ${x.user_id!==m.mestre_id||x.user_id===me.id?`<button class="btn ghost small" data-ficha="${esc(x.user_id)}">${x.user_id===me.id||mestre?'Ficha ✎':'Ficha'}</button>`:''}</div>`; }).join('')}</div>
  </section>
  ${mestre?`<section>
    <h3>🔑 Convite</h3>
    <div class="code">${esc(m.codigo)}</div>
    <div class="stack"><button class="btn small" id="bCopiar">Copiar link do convite</button><button class="btn ghost small" id="bZapConv">Mandar convite no WhatsApp</button></div>
  </section>
  <section>
    <h3>⚙️ Mesa</h3>
    <div class="stack">
      <label class="f" style="margin:0">Situação<select id="sStatus"><option value="ativa">Ativa</option><option value="pausada">Pausada</option><option value="encerrada">Encerrada</option></select></label>
      <button class="btn ghost small" id="bEditMesa">Editar nome e premissa</button>
      ${jog.length?'<button class="btn ghost small" id="bRemover">Remover jogador</button>':''}
      <button class="btn danger small" id="bApagar">Apagar mesa</button>
    </div>
  </section>`:`<section><h3>🚪 Mesa</h3><button class="btn ghost small" id="bSair">Sair desta mesa</button></section>`}`;
  s.querySelectorAll('[data-ficha]').forEach(b=>b.onclick=()=>ficha(b.dataset.ficha));
  $('#bZap').onclick=()=>{ const ult=[...S.posts].reverse().find(p=>['narracao','cena'].includes(p.tipo)&&!p.para_id);
    const quem=jog.filter(j=>ag.includes(j.user_id)).map(j=>j.personagem||nomeJog(j.user_id));
    const txt=`🎲 *${m.nome}*\n${ult?String(ult.texto).slice(0,180)+(String(ult.texto).length>180?'…':''):'Tem novidade na mesa!'}\n${quem.length?`\n⏳ Esperando: ${quem.join(', ')}\n`:''}\nResponda aqui: ${location.origin}${location.pathname}?m=${m.id}`;
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener'); };
  if(mestre){
    s.querySelectorAll('[data-ag]').forEach(c=>c.onchange=async()=>{ const set=new Set(S.mesa.aguardando||[]); c.checked?set.add(c.dataset.ag):set.delete(c.dataset.ag);
      const nv=[...set]; const {error}=await sb.from('rpg_mesas').update({aguardando:nv}).eq('id',m.id); if(error){ toast(errMsg(error)); c.checked=!c.checked; return; } S.mesa.aguardando=nv; renderSide(); });
    $('#bResumo').onclick=()=>dialog(`<h2>📖 Diário da campanha</h2><p class="muted" style="font-size:.9rem;margin-top:0">O que já aconteceu, pistas, NPCs importantes. Fica sempre visível ao lado da mesa.</p><textarea id="dRes" maxlength="8000">${esc(m.resumo)}</textarea>`,async ov=>{
      const v=ov.querySelector('#dRes').value; const {error}=await sb.from('rpg_mesas').update({resumo:v}).eq('id',m.id); if(error) throw error; S.mesa.resumo=v; renderSide(); });
    $('#bCopiar').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Link do convite copiado!')).catch(()=>prompt('Copie o link:',link)); };
    $('#bZapConv').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(`🎲 Bora jogar RPG? Entre na mesa *${m.nome}*${m.sistema?` (${m.sistema})`:''} no Deck e Dados:\n${link}\nCódigo: ${m.codigo}`),'_blank','noopener');
    const st=$('#sStatus'); st.value=m.status; st.onchange=async()=>{ const {error}=await sb.from('rpg_mesas').update({status:st.value}).eq('id',m.id); if(error){ toast(errMsg(error)); return; } S.mesa.status=st.value; renderMesa(); };
    $('#bEditMesa').onclick=()=>dialog(`<h2>Editar mesa</h2><label class="f">Nome<input id="dNome" maxlength="80" value="${esc(m.nome)}"></label><label class="f">Sistema<input id="dSis" maxlength="60" value="${esc(m.sistema)}"></label><label class="f">Premissa<textarea id="dDesc" maxlength="2000" style="min-height:120px">${esc(m.descricao)}</textarea></label>`,async ov=>{
      const v={nome:ov.querySelector('#dNome').value.trim(),sistema:ov.querySelector('#dSis').value.trim(),descricao:ov.querySelector('#dDesc').value.trim()};
      if(v.nome.length<2) throw new Error('Dê um nome à mesa.'); const {error}=await sb.from('rpg_mesas').update(v).eq('id',m.id); if(error) throw error; Object.assign(S.mesa,v); renderMesa(); });
    if($('#bRemover')) $('#bRemover').onclick=()=>dialog(`<h2>Remover jogador</h2><label class="f">Quem sai da mesa?<select id="dQuem">${jog.map(j=>`<option value="${esc(j.user_id)}">${esc(j.personagem)} (${esc(nomeJog(j.user_id))})</option>`).join('')}</select></label><p class="muted" style="font-size:.9rem">As mensagens dele continuam na história.</p>`,async ov=>{
      const u=ov.querySelector('#dQuem').value; const {error}=await sb.from('rpg_membros').delete().eq('mesa_id',m.id).eq('user_id',u); if(error) throw error; await carregarMesa(m.id); renderSide(); renderComposer(); },'Remover');
    $('#bApagar').onclick=()=>confirmar(`A mesa <b>${esc(m.nome)}</b> e toda a história serão apagadas para sempre. Prefere só <b>encerrar</b>? Assim a história fica salva.`,async()=>{
      const {error}=await sb.from('rpg_mesas').delete().eq('id',m.id); if(error) throw error; location.href='/mesa.html'; },'Apagar para sempre');
  } else {
    $('#bSair').onclick=()=>confirmar('Você sai da mesa. Suas mensagens continuam na história. Para voltar, peça o código ao mestre.',async()=>{
      const {error}=await sb.from('rpg_membros').delete().eq('mesa_id',m.id).eq('user_id',me.id); if(error) throw error; location.href='/mesa.html'; },'Sair');
  }
}
function ficha(uid){
  const x=membro(uid); if(!x) return; const pode=uid===me.id||souMestre();
  if(!pode){ dialog(`<h2>${esc(x.personagem||nomeJog(uid))}</h2><p class="muted" style="margin-top:-8px;font-family:var(--ui);font-size:.85rem">Jogador: ${esc(nomeJog(uid))}${x.pv_max?` · PV ${esc(x.pv_atual??x.pv_max)}/${esc(x.pv_max)}`:''}</p><div style="white-space:normal">${x.ficha?fmt(x.ficha):'<span class="muted">Ficha ainda não preenchida.</span>'}</div>`); return; }
  dialog(`<h2>Ficha de ${esc(x.personagem||nomeJog(uid))}</h2>
    <label class="f">Nome do personagem<input id="fNome" maxlength="60" value="${esc(x.personagem)}"></label>
    <div class="row"><label class="f">PV atuais<input id="fPa" type="number" value="${x.pv_atual??''}"></label><label class="f">PV máximos<input id="fPm" type="number" min="1" value="${x.pv_max??''}"></label></div>
    <label class="f">Ficha (atributos, perícias, equipamentos, história)<textarea id="fTxt" maxlength="6000" placeholder="FOR 16 · DES 12 · CON 14…&#10;Espada longa, escudo, 20 PO&#10;História: …">${esc(x.ficha)}</textarea></label>`,async ov=>{
    const n=v=>v===''?null:Math.trunc(+v);
    const v={personagem:ov.querySelector('#fNome').value.trim(),ficha:ov.querySelector('#fTxt').value,pv_atual:n(ov.querySelector('#fPa').value),pv_max:n(ov.querySelector('#fPm').value)};
    const {error}=await sb.from('rpg_membros').update(v).eq('mesa_id',S.mesa.id).eq('user_id',uid); if(error) throw error; Object.assign(x,v); renderSide(); renderComposer(); });
}

/* ---------- tempo real, novidades e "lido" ---------- */
function addPosts(list,mineScroll){
  let novos=0; list.forEach(p=>{ const i=S.posts.findIndex(x=>x.id===p.id); if(i>=0) S.posts[i]=p; else { S.posts.push(p); if(p.autor_id!==me.id) novos++; } });
  S.posts.sort((a,b)=>a.id-b.id);
  const perto=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-260;
  renderFeed();
  if(mineScroll||perto){ const c=$('#composer'); c&&c.scrollIntoView({block:'end'}); }
  else if(novos){ S.unseen+=novos; pill(); }
  if(novos){ if(document.hidden){ S.titleCount=(S.titleCount||0)+novos; document.title=`(${S.titleCount}) ${S.mesa.nome} | Mesa de RPG`; } else marcarLido(); }
}
function pill(){ let b=$('#newpill'); if(!S.unseen){ b&&b.remove(); return; }
  if(!b){ b=document.createElement('button'); b.className='newpill'; b.id='newpill'; document.body.appendChild(b); b.onclick=()=>{ S.unseen=0; pill(); $('#composer').scrollIntoView({block:'end'}); }; }
  b.textContent=`↓ ${S.unseen} nova${S.unseen>1?'s':''} mensage${S.unseen>1?'ns':'m'}`; }
window.addEventListener('scroll',()=>{ if(S.unseen&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-260){ S.unseen=0; pill(); } },{passive:true});
async function buscarNovos(mine){
  const ult=S.posts.length?S.posts[S.posts.length-1].id:0;
  const {data}=await sb.from('rpg_posts').select('*').eq('mesa_id',S.mesa.id).gt('id',ult).order('id',{ascending:true});
  if(data&&data.length) addPosts(data,mine);
}
let tAtual=0;
function atualizarMesa(){ clearTimeout(tAtual); tAtual=setTimeout(async()=>{ const antes=JSON.stringify([S.mesa&&S.mesa.aguardando,S.mesa&&S.mesa.status,S.membros.map(m=>[m.personagem,m.pv_atual,m.pv_max])]);
  await carregarMesa(S.mesa.id); if(!S.mesa){ location.href='/mesa.html'; return; }
  const depois=JSON.stringify([S.mesa.aguardando,S.mesa.status,S.membros.map(m=>[m.personagem,m.pv_atual,m.pv_max])]);
  if(antes!==depois){ const ae=document.activeElement, emTexto=ae&&ae.id==='cTxt'; if(emTexto) renderSide(); else renderMesa(); } },800); }
let tLido=0;
function marcarLido(){ clearTimeout(tLido); tLido=setTimeout(()=>{ sb.from('rpg_membros').update({ultimo_lido:new Date().toISOString()}).eq('mesa_id',S.mesa.id).eq('user_id',me.id).then(()=>{}); },1500); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.mesa){ S.titleCount=0; document.title=`${S.mesa.nome} | Mesa de RPG`; buscarNovos(false); atualizarMesa(); marcarLido(); } });
function conectarTempoReal(id){
  try{
    S.chan=sb.channel('mesa-'+id).on('postgres_changes',{event:'*',schema:'public',table:'rpg_posts',filter:'mesa_id=eq.'+id},pl=>{
      if(pl.eventType==='INSERT'){ addPosts([pl.new],false); atualizarMesa(); }
      else if(pl.eventType==='UPDATE'){ const i=S.posts.findIndex(x=>x.id===pl.new.id); if(i>=0){ S.posts[i]=pl.new; renderFeed(); } }
      else if(pl.eventType==='DELETE'){ const old=pl.old&&pl.old.id; if(old){ S.posts=S.posts.filter(x=>x.id!==old); renderFeed(); } }
    }).subscribe();
  }catch(e){}
  S.poll=setInterval(()=>{ if(!document.hidden){ buscarNovos(false); atualizarMesa(); } },25000);
}

start().catch(e=>{ console.error(e); $('#app').innerHTML=`<p class="empty">Erro ao carregar: ${esc(errMsg(e))}</p>`; });
})();
</script>
