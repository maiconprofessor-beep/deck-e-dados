/* Layout: livro aberto sobre a mesa de feltro do Deck e Dados — leitura à esquerda, Folha de Aventuras à direita; empilha no celular. Tema escuro único, como o site. */

<script type="text/plain" id="aventura">
Título: O Farol da Maré Negra
Autor: Maicon Kuzer
Habilidade: 1d6+6
Energia: 2d6+12
Sorte: 1d6+6
Poções: Habilidade, Força, Fortuna
Equipamento: Espada, Armadura de couro, Mochila
Provisões: 10
Ouro: 8

Porto Salgado é um punhado de casas caiadas agarradas a uma baía de pedra escura, onde o vento cheira a sal e a peixe seco. Você chegou ao entardecer, procurando trabalho para sua espada, e encontrou o vilarejo inteiro reunido no cais, olhando para o mar.

A três milhas da costa, sobre o Rochedo do Corvo, ergue-se o velho farol. Por cem anos a luz dele foi amarela e quente, e guiou os barcos para longe dos recifes que os pescadores chamam de Dentes do Corvo. Há nove noites, a luz ficou verde. Desde então, três navios se despedaçaram nos recifes, e os poucos corpos que o mar devolveu chegaram à praia com os olhos abertos e sem uma gota de água nos pulmões.

A prefeita, Dona Celeste Amaral, é uma mulher pequena e firme, de mãos marcadas por anos de remendar redes. "A frota de pesca saiu há doze dias. Trinta barcos, metade dos homens e mulheres desta vila. Eles voltam esta madrugada, antes do sol nascer. Se aquela luz ainda estiver verde, vão todos para os Dentes do Corvo."

Ela coloca uma bolsa de couro na sua mão. "Cinquenta peças de ouro quando a luz voltar a ser amarela. É tudo o que a vila tem. Ninguém que foi ao Rochedo voltou, nem o velho faroleiro Oleandro respondeu aos nossos sinais."

Você olha para a luz verde pulsando no horizonte, lenta como um coração. Depois aceita a bolsa.

## 1
O sol desce atrás do mar e a luz verde do farol fica mais forte. Você tem até a madrugada. Antes de partir, pode se preparar em Porto Salgado, mas cada hora conta.
-> 123 Ir até o cais e ver como chegar ao Rochedo
-> 29 Andar pelo vilarejo e se preparar primeiro

## 2
Você se encosta na rocha e espera a rajada passar. Depois continua, passo a passo, até a trilha alargar perto de um ninho enorme feito de ossos e redes velhas.
-> 319 Examinar o ninho

## 3
No ninho há uma pulseira de prata e um frasco de rum fechado. Você guarda a pulseira e bebe um gole do rum para aquecer.
ouro: +4
energia: +1
anota: Varanda Limpa
-> 174 Voltar para dentro

## 4
"É o Corredor de Prata", diz Joana, franzindo a testa. "Afundou na primeira noite da luz verde. Dez minutos, nem um a mais." Ela encosta o barco no casco tombado. A água está calma, calma demais.
-> 283 Subir no convés inclinado
-> 272 Mudar de ideia e seguir viagem

## 5
Antes de abrir o alçapão da galeria, você para. Lá em cima, a voz canta. Lá embaixo, o mar espera. Você pensa no que trouxe até aqui e no que ainda falta.
-> 108 [provisões 1+] Comer uma última refeição
-> 182 Subir para a galeria

## 6
Atrás do altar do templo submerso, como dizia o avô de Gaspar, há uma escada estreita de pedra que sobe para dentro da rocha. A água vai ficando para trás e a escada continua subindo, até terminar numa parede de tijolos com uma pedra solta.
-> 276 Empurrar a pedra solta

## 7
"Não se olha nos olhos dela", diz Quincas, de repente sóbrio. "Não se ouve o canto dela. Não se toca no coração dela com a mão. E não se aceita presente dela. Quatro regras. Quem quebrou uma só já foi para o fundo."
anota: Quatro Regras
-> 123 Agradecer

## 8
Entre as casas vazias aparece um cachorro magro, de pelo cinzento e uma orelha rasgada. Ele rosna para o farol e depois olha para você, abanando o rabo devagar.
-> 113 [provisões 1+] Dar comida ao cachorro
-> 320 Seguir em frente

## 9
A sua espada se parte ao meio como vidro. A pérola nem sente. A luz verde pulsa mais forte e, lá longe, você vê a primeira lanterna da frota balançar perto dos recifes.
perde: Espada
energia: -2
-> 310 [Oleandro Desperto] Gritar por Oleandro
-> 331 Não ter mais nada para tentar

## 10
Entre as ferramentas há uma chave inglesa enorme, pesada como um martelo, e um caderno de manutenção. Na última página, a letra firme de um técnico: "Mecanismo de rotação: se a lente principal for trocada, girar a manivela três voltas para a esquerda antes de acender."
ganha: Chave Inglesa
anota: Manual do Mecanismo
-> 56 Continuar

## 11
Você guarda o peixe seco e os biscoitos na mochila. Duros como pedra, mas sustentam.
ouro: -2
provisões: +3
-> 33 Continuar

## 12
A chama acende. É fraca, mas é amarela.
-> 268 Olhar o mar

## 13
A lâmina verde-azulada do templo brilha na mão. A Viúva reconhece a arma e recua um passo, mas ataca mesmo assim.
combate: Morgessa, a Viúva | 9 | 9
-> 157 Ela se transforma

## 14
Pela luneta você vê as lanternas da frota ao longe. Se o farol tiver qualquer luz amarela, ela vai iluminar as bandeiras.
-> 320 Descer

## 15
Uma coroa de coral aparece flutuando à sua frente, linda e vermelha. Você a pega. No mesmo instante, sente o peito apertar: o Fôlego de Sereia acabou. A água entra no seu nariz e na sua boca, e você sobe desesperado.
ganha: Coroa de Coral
aflição: Marca da Viúva
energia: -4
anota: Altar Visitado
-> 264 Chegar à tona, sem fôlego

## 16
O tubarão bate no casco, e o barco quase vira. Quando ele vem de novo, com a boca aberta, você golpeia.
combate: Tubarão-Cinzento | 7 | 9
-> 211 Continuar remando

## 17
A voz chama o seu nome. Você não lembra de ter dito seu nome a ninguém em Porto Salgado. Joana larga o leme, com os olhos vidrados, e caminha para a borda do barco.
teste de sorte: 60 | 54

## 18
Os devotos caem e, ao morrer, os olhos deles voltam a ser castanhos e assustados. Um deles, antes de fechar os olhos, sussurra: "Desculpa... ela prometeu trazer meu filho de volta do mar." Sobre o altar, entre as velas negras, há uma chave de ferro em forma de âncora.
ganha: Chave-Âncora
-> 399 Levantar a imagem da Senhora das Ondas
-> 320 Sair da capela

## 19
A figura de proa se desfaz em lascas. No lugar do coração, encaixada na madeira, havia uma pedra verde, que se apaga e vira poeira na sua mão. Algo, ou alguém, estava usando aquela coisa como olhos.
anota: Olhos da Viúva Cegos
sorte: +1
-> 395 Continuar procurando

Você aceitou subir até lá e descobrir o que aconteceu.

## 1
A porta da torre está entreaberta. Lá dentro, o ar cheira a óleo velho e ferrugem. Uma escada em espiral sobe para a escuridão. À esquerda, há uma pequena oficina com uma vela ainda acesa.
-> 2 Entrar na oficina
-> 3 Subir a escada imediatamente

## 2
A bancada está coberta de engrenagens. Sob um pano você encontra uma chave de latão com dentes em forma de roda dentada. Pendurado na parede há um martelo de relojoeiro, pesado e bem equilibrado.
ganha: Chave de Engrenagem
arma: Martelo do Relojoeiro | +1
-> 3 Voltar e subir a escada

## 3
No meio da escada, um degrau range e cede sob o seu pé.
teste de sorte: 4 | 5

## 4
Você se agarra ao corrimão bem a tempo. O degrau despenca no escuro e leva vários segundos até bater no chão.
-> 6 Seguir até o topo

## 5
Você escorrega e torce o tornozelo na pedra antes de conseguir se segurar.
energia: -2
aflição: Tornozelo torcido
-> 6 Mancar até o topo

## 6
A sala do mecanismo é enorme. Sobre o eixo principal está empoleirado um corvo feito de latão, do tamanho de um cão. Ao mesmo tempo, um rato de corda sai de trás de um pêndulo. Os dois atacam juntos.
combate: Corvo de Latão | 7 | 8
combate junto: Rato de Corda | 5 | 4
fuga -> 9
-> 7 Examinar o mecanismo

## 7
Com os autômatos desmontados no chão, você enxerga o problema: uma portinhola trancada no coração do mecanismo, de onde vêm batidas abafadas.
-> 8 [Chave de Engrenagem] Usar a chave de latão
-> 14 [fé 7+] Pôr a mão sobre a portinhola e rezar
-> 10 Forçar a portinhola com as mãos

## 8
A chave gira com um estalo. Encolhido entre as engrenagens está o próprio Anselmo, faminto mas vivo. Ele construiu os autômatos para guardar a torre e acabou trancado pela própria criação.

Juntos, vocês dão corda no grande relógio. Lá embaixo, a vila inteira ouve o primeiro badalo em três dias.
ouro: +20
fé: +1
cura: Tornozelo torcido
fim: Você salvou o relojoeiro e devolveu as horas a Vau Cinzento.

## 9
Você desce correndo e só para do lado de fora. A torre continua em silêncio.
fim: Você sobreviveu, mas o relógio continua parado.

## 10
Você puxa a portinhola com toda a força. Uma engrenagem solta prende sua manga e arrasta seu braço para dentro do mecanismo.
energia: -3
teste de habilidade: 11 | 12

## 11
Com um puxão firme você se solta. Do outro lado da portinhola, uma voz rouca grita: *"A chave! Ficou na oficina!"*
-> 13 Descer até a oficina

## 12
A engrenagem não solta. Quando finalmente se livra, você está ferido demais para continuar, e os moradores precisam carregá-lo de volta para a vila.
fim: Sua aventura termina aqui.

## 13
Você desce pulando o degrau quebrado e encontra a chave de latão na bancada.
ganha: Chave de Engrenagem
-> 8 Voltar e abrir a portinhola

## 14
Por um instante as engrenagens param de girar. A portinhola se abre sozinha, como se o próprio mecanismo reconhecesse suas boas intenções.
habilidade inicial: +1
-> 8 Entrar

<script>
(function(){
const $=s=>document.querySelector(s);

const d6=()=>1+Math.floor(Math.random()*6);
const KEY='livrojogo.texto.v2', NKEY='livrojogo.anotacoes';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Trilha de suspense (sintetizada no navegador) ---------- */
const Music=(()=>{
  let ctx=null,master,bus,lp,on=false,combat=false,vol=0.55,timer=0,nextNote=0,nextBeat=0;
  const AC=window.AudioContext||window.webkitAudioContext;
  const SCALE=[62,63,65,67,69,70,72,74,75,77]; // ré frígio
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function impulse(sec){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}
  function osc(type,f,det,g,dest){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;const gn=ctx.createGain();gn.gain.value=g;o.connect(gn);gn.connect(dest);o.start();return gn;}
  function build(){
    ctx=new AC();
    master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    const verb=ctx.createConvolver();verb.buffer=impulse(5);const wet=ctx.createGain();wet.gain.value=0.7;verb.connect(wet);wet.connect(master);
    const dry=ctx.createGain();dry.gain.value=0.55;dry.connect(master);
    bus={verb,dry};
    lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;lp.Q.value=5;lp.connect(dry);lp.connect(verb);
    const lfo=ctx.createOscillator();lfo.frequency.value=0.045;const lg=ctx.createGain();lg.gain.value=110;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    osc('sawtooth',36.71,-8,0.16,lp);osc('sawtooth',36.71,8,0.16,lp);osc('sawtooth',55,-5,0.08,lp);osc('triangle',73.42,4,0.10,lp);
    const dis=osc('sine',77.78,0,0,lp); // mi bemol: a dissonância que vai e volta
    bus.dis=dis;
    const nb=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=450;bp.Q.value=0.9;
    const wg=ctx.createGain();wg.gain.value=0.035;ns.connect(bp);bp.connect(wg);wg.connect(verb);ns.start();
    const wl=ctx.createOscillator();wl.frequency.value=0.07;const wlg=ctx.createGain();wlg.gain.value=280;wl.connect(wlg);wlg.connect(bp.frequency);wl.start();
    nextNote=ctx.currentTime+2;nextBeat=ctx.currentTime;
  }
  function bell(f,t,amp,len){
    [1,2.01,2.76,5.4].forEach((r,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(amp/(i+1.5),t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+len/(1+i*0.7));
      o.connect(g);g.connect(bus.verb);if(i===0)g.connect(bus.dry);o.start(t);o.stop(t+len+0.1);});
  }
  function thump(t,amp){const o=ctx.createOscillator();o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(38,t+0.16);
    const g=ctx.createGain();g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);o.connect(g);g.connect(bus.dry);o.start(t);o.stop(t+0.32);}
  function tick(){
    if(!on||!ctx) return;
    const now=ctx.currentTime;
    while(nextNote<now+0.5){
      const n=1+Math.floor(Math.random()*(combat?3:2));
      for(let i=0;i<n;i++){const m=SCALE[Math.floor(Math.random()*SCALE.length)]-(Math.random()<0.35?12:0);bell(mtof(m),nextNote+i*(combat?0.35:0.9),combat?0.09:0.06,combat?2.5:5);}
      if(Math.random()<0.4){bus.dis.gain.cancelScheduledValues(nextNote);bus.dis.gain.setTargetAtTime(combat?0.12:0.07,nextNote,2);bus.dis.gain.setTargetAtTime(0,nextNote+5,3);}
      nextNote+=combat?1.6+Math.random()*1.4:4+Math.random()*5;
    }
    if(combat){while(nextBeat<now+0.5){thump(nextBeat,0.55);thump(nextBeat+0.24,0.38);nextBeat+=0.82;}}
    else nextBeat=now;
  }
  function level(){if(master&&ctx)master.gain.setTargetAtTime(on?vol*0.7:0,ctx.currentTime,0.6);}
  return {
    get on(){return on;},
    toggle(){
      if(!AC) return false;
      try{ if(!ctx) build(); on=!on;
        if(on){ctx.resume();nextNote=Math.max(nextNote,ctx.currentTime+0.5);clearInterval(timer);timer=setInterval(tick,200);}
        else{clearInterval(timer);setTimeout(()=>{if(!on&&ctx)ctx.suspend();},2500);}
        level(); return on;
      }catch(e){on=false;return false;}
    },
    volume(v){vol=v;level();},
    setCombat(c){
      if(c===combat) return; combat=c;
      if(ctx&&on){lp.frequency.cancelScheduledValues(ctx.currentTime);lp.frequency.setTargetAtTime(c?520:200,ctx.currentTime,1.2);nextNote=ctx.currentTime+0.3;}
    },
    sting(){ if(!ctx||!on) return; const t=ctx.currentTime+0.05; [50,51,57].forEach(m=>bell(mtof(m),t,0.16,7)); thump(t,0.9); },
    fanfare(){ if(!ctx||!on) return; const t=ctx.currentTime+0.05; [62,66,69,74].forEach((m,i)=>bell(mtof(m),t+i*0.35,0.11,6)); }
  };
})();

/* ---------- Leitor do formato ---------- */
const STATKEY={habilidade:'hab',energia:'ene',sorte:'sor','fé':'fe',fe:'fe',ouro:'ouro','provisões':'prov',provisoes:'prov'};
const NAME={hab:'Habilidade',ene:'Energia',sor:'Sorte',fe:'Fé',ouro:'Ouro',prov:'Provisões'};
const sk=w=>STATKEY[w.toLowerCase()];
const W='(habilidade|energia|sorte|f[éÉeE]|ouro|provis[õÕoO]es)';
const RX={
  formula:new RegExp('^'+W+'\\s*:\\s*(\\d+)\\s*d6\\s*(?:\\+\\s*(\\d+))?\\s*$','i'),
  max:new RegExp('^'+W+'\\s+inicial\\s*:\\s*([+-]?\\d+)\\s*$','i'),
  stat:new RegExp('^'+W+'\\s*:\\s*([+-]?\\d+)\\s*$','i'),
  test:new RegExp('^teste\\s+de\\s+(sorte|habilidade|f[éÉeE])\\s*:\\s*(\\d+)\\s*\\|\\s*(\\d+)\\s*$','i'),
  req:new RegExp('^'+W+'\\s+(\\d+)\\s*\\+$','i')
};
function parse(text){
  const b={title:'Sem título',autor:'',intro:[],secs:{},order:[],errors:[],formula:{hab:[1,6],ene:[2,12],sor:[1,6]},equip:[],prov:10,ouro:0,pocoes:[]};
  let cur=null;
  text.split(/\r?\n/).forEach((raw,i)=>{
    const t=raw.trim(), ln=i+1; let m;
    if(!cur){
      if(m=t.match(/^t[íÍiI]tulo\s*:\s*(.+)$/i)){b.title=m[1];return;}
      if(m=t.match(/^autor\s*:\s*(.+)$/i)){b.autor=m[1].trim();return;}
      if(m=t.match(RX.formula)){b.formula[sk(m[1])]=[+m[2],+(m[3]||0)];return;}
      if(m=t.match(/^po[çÇcC][õÕoO]es\s*:\s*(.+)$/i)){b.pocoes=m[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);return;}
      if(m=t.match(/^equipamento\s*:\s*(.+)$/i)){b.equip=m[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);return;}
      if(m=t.match(/^provis[õÕoO]es\s*:\s*(\d+)\s*$/i)){b.prov=+m[1];return;}
      if(m=t.match(/^ouro\s*:\s*(\d+)\s*$/i)){b.ouro=+m[1];return;}
    }
    if(m=t.match(/^#+\s*(\d+)\s*$/)){
      if(b.secs[m[1]]) b.errors.push(`Seção ${m[1]} aparece duas vezes (linha ${ln}).`);
      cur={id:m[1],lines:[],choices:[],effects:[],groups:[],tests:[],flee:null,end:null};
      b.secs[m[1]]=cur;b.order.push(m[1]);return;
    }
    if(!cur){b.intro.push(raw);return;}
    if(m=t.match(/^->\s*(\d+)\s*((?:\[[^\]]+\]\s*)*)(.*)$/)){const reqs=[...m[2].matchAll(/\[([^\]]+)\]/g)].map(x=>x[1].trim());cur.choices.push({to:m[1],reqs,label:m[3].trim()||('Vá para '+m[1])});return;}
    if(/^->/.test(t)){b.errors.push(`Linha ${ln}: escolha sem número de destino.`);return;}
    if(m=t.match(/^combate(\s+junto|\s*\+)?\s*:\s*(.+?)\s*\|\s*(\d+)\s*\|\s*(\d+)\s*(?:->\s*(\d+))?\s*$/i)){
      const foe={name:m[2],hab:+m[3],ene:+m[4]};
      let g; if(m[1]&&cur.groups.length){g=cur.groups[cur.groups.length-1];g.foes.push(foe);} else {g={foes:[foe],to:null};cur.groups.push(g);}
      if(m[5]) g.to=m[5]; return;
    }
    if(/^combate/i.test(t)&&/:/.test(t)){b.errors.push(`Linha ${ln}: combate fora do formato "Nome | HAB | ENE".`);return;}
    if(m=t.match(/^fuga\s*->\s*(\d+)\s*$/i)){cur.flee=m[1];return;}
    if(m=t.match(RX.test)){cur.tests.push({kind:sk(m[1]),ok:m[2],fail:m[3]});return;}
    if(m=t.match(/^(ganha|perde)\s*:\s*(.+)$/i)){cur.effects.push({type:m[1].toLowerCase(),item:m[2].trim()});return;}
    if(m=t.match(/^arma\s*:\s*(.+?)\s*(?:\|\s*([+-]?\d+))?\s*$/i)){cur.effects.push({type:'arma',item:m[1],n:+(m[2]||0)});return;}
    if(m=t.match(/^afli[çÇcC][ãÃaA]o\s*:\s*(.+)$/i)){cur.effects.push({type:'afl',item:m[1].trim()});return;}
    if(m=t.match(/^cura\s*:\s*(.+)$/i)){cur.effects.push({type:'cura',item:m[1].trim()});return;}
    if(m=t.match(/^anota\s*:\s*(.+)$/i)){cur.effects.push({type:'anota',item:m[1].trim()});return;}
    if(m=t.match(RX.max)){cur.effects.push({type:'max',stat:sk(m[1]),n:+m[2]});return;}
    if(m=t.match(RX.stat)){cur.effects.push({type:'stat',stat:sk(m[1]),n:+m[2]});return;}
    if(m=t.match(/^fim\s*(?::\s*(.*))?$/i)){cur.end=(m[1]||'').trim()||'Fim da aventura.';return;}
    cur.lines.push(raw);
  });
  return b;
}
function targets(s){return [...s.choices.map(c=>c.to),...s.groups.map(g=>g.to).filter(Boolean),...(s.flee?[s.flee]:[]),...s.tests.flatMap(t=>[t.ok,t.fail])];}
function check(b){
  const probs=b.errors.map(e=>({err:true,msg:e}));
  if(!b.order.length){probs.push({err:true,msg:'Nenhuma seção encontrada. Comece uma com "## 1".'});return probs;}
  b.order.forEach(id=>{const s=b.secs[id];
    targets(s).forEach(t=>{if(!b.secs[t])probs.push({err:true,msg:`Seção ${id} manda para ${t}, que não existe.`});});
    s.tests.forEach(t=>{if(t.kind==='fe'&&!b.formula.fe)probs.push({err:true,msg:`Seção ${id} testa a Fé, mas o cabeçalho não tem "Fé: 1d6+3".`});});
    if(!s.end && !s.choices.length && !s.tests.length && !s.groups.some(g=>g.to)) probs.push({err:false,msg:`Seção ${id} não tem saída nem "fim".`});
  });
  const seen=new Set([b.order[0]]),q=[b.order[0]];
  while(q.length){const s=b.secs[q.shift()];targets(s).forEach(t=>{if(b.secs[t]&&!seen.has(t)){seen.add(t);q.push(t);}});}
  const orphan=b.order.filter(id=>!seen.has(id));
  if(orphan.length) probs.push({err:false,msg:`Ninguém chega a: ${orphan.join(', ')}.`});
  return probs;
}

/* ---------- Estado de jogo ---------- */
function freshState(){return {phase:'start',char:null,roll:null,sec:null,visited:[],fight:null,tests:{},notes:[],dead:false};}
const STATS=['hab','ene','sor','fe'];
function rollChar(){
  const c={items:[...book.equip],weapons:{},afl:[],flags:[],ouro:book.ouro,prov:book.prov}; S.roll={};
  STATS.forEach(k=>{const f=book.formula[k];if(!f)return;const r=Array.from({length:f[0]},d6);const v=r.reduce((a,x)=>a+x,0)+f[1];S.roll[k]=r;c[k]=v;c[k+'Max']=v;});
  S.char=c;
}
const lc=s=>s.toLowerCase();
const has=n=>[S.char.items,S.char.afl,S.char.flags].some(L=>L.some(i=>lc(i)===lc(n)));
function reqOk(req){
  if(!req) return true; let m;
  if(m=req.match(RX.req)) return (S.char[sk(m[1])]||0)>=+m[2];
  if(req.startsWith('!')) return !has(req.slice(1).trim());
  return has(req);
}
function reqText(req,ok){
  let m;
  if(m=req.match(RX.req)) return `Requer ${NAME[sk(m[1])]} ${m[2]} ou mais`;
  if(req.startsWith('!')) return ok?`Você não tem: ${req.slice(1).trim()}`:`Só sem: ${req.slice(1).trim()}`;
  return ok?`Você tem: ${req}`:`Requer: ${req}`;
}
const bonus=()=>{const v=Object.values(S.char.weapons);return v.length?Math.max(...v):0;};
const bestWeapon=()=>{let n=null,b=-99;for(const [k,v] of Object.entries(S.char.weapons)){if(v>b){b=v;n=k;}}return n;};
function clamp(c){
  ['hab','ene','sor'].forEach(k=>{c[k]=Math.max(0,Math.min(c[k],c[k+'Max']));});
  if(c.fe!=null) c.fe=Math.max(0,c.fe);
  c.ouro=Math.max(0,c.ouro);c.prov=Math.max(0,c.prov);
}
function enter(id){
  const s=book.secs[id], c=S.char;
  S.phase='play';S.sec=id;S.visited.push(id);S.tests={};S.notes=[];S.fight=null;
  if(!s){render();return;}
  const sign=n=>(n>=0?'+':'−')+Math.abs(n);
  s.effects.forEach(f=>{
    if(f.type==='ganha'){if(!has(f.item))c.items.push(f.item);S.notes.push({cls:'good',t:'Ganhou: '+f.item});}
    else if(f.type==='anota'){if(!c.flags.some(i=>lc(i)===lc(f.item))){c.flags.push(f.item);S.notes.push({cls:'',t:'Anotado: '+f.item});}}
    else if(f.type==='perde'){c.items=c.items.filter(i=>lc(i)!==lc(f.item));c.flags=c.flags.filter(i=>lc(i)!==lc(f.item));for(const k in c.weapons)if(lc(k)===lc(f.item))delete c.weapons[k];S.notes.push({cls:'bad',t:'Perdeu: '+f.item});}
    else if(f.type==='arma'){if(!c.items.some(i=>lc(i)===lc(f.item)))c.items.push(f.item);c.weapons[f.item]=f.n;S.notes.push({cls:'good',t:`Arma: ${f.item}${f.n?' ('+sign(f.n)+' Habilidade)':''}`});}
    else if(f.type==='afl'){if(!c.afl.some(i=>lc(i)===lc(f.item)))c.afl.push(f.item);S.notes.push({cls:'bad',t:'Aflição: '+f.item});}
    else if(f.type==='cura'){if(c.afl.some(i=>lc(i)===lc(f.item))){c.afl=c.afl.filter(i=>lc(i)!==lc(f.item));S.notes.push({cls:'good',t:'Livrou-se de: '+f.item});}}
    else if(f.type==='max'){if(c[f.stat+'Max']!=null)c[f.stat+'Max']+=f.n;c[f.stat]=(c[f.stat]||0)+f.n;S.notes.push({cls:f.n>=0?'good':'bad',t:`${NAME[f.stat]} inicial ${sign(f.n)}`});}
    else {c[f.stat]=(c[f.stat]||0)+f.n;S.notes.push({cls:f.n>=0?'good':'bad',t:`${NAME[f.stat]} ${sign(f.n)}`});}
  });
  clamp(c);
  if(s.groups.length) S.fight={g:0,hp:s.groups.map(g=>g.foes.map(f=>f.ene)),target:0,log:[],last:null,goto:null,done:false};
  if(c.ene<=0) S.dead=true;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
const dice=a=>a.map(n=>`<span class="die">${n}</span>`).join('');
function testLuck(){
  const r=[d6(),d6()],sum=r[0]+r[1],before=S.char.sor;
  const ok=before>1&&sum<=before; S.char.sor=Math.max(0,before-1);
  return {r,sum,target:before,ok,auto:before<=1};
}

function attack(){
  const s=book.secs[S.sec],f=S.fight,G=s.groups[f.g],hp=f.hp[f.g];
  const a=[d6(),d6()],B=bonus(),fa=a[0]+a[1]+S.char.hab+B;
  let hit=false,hurt=false;
  const lines=[];
  G.foes.forEach((foe,i)=>{
    if(hp[i]<=0) return;
    const r=[d6(),d6()],fb=r[0]+r[1]+foe.hab; let res;
    if(i===f.target){
      if(fa>fb){hp[i]-=2;hit=true;res=`<span class="res-ok">você feriu (−2)</span>`;}
      else if(fb>fa){S.char.ene-=2;hurt=true;res=`<span class="res-bad">feriu você (−2)</span>`;}
      else res='golpes evitados';
    } else {
      if(fb>fa){S.char.ene-=2;hurt=true;res=`<span class="res-bad">feriu você (−2)</span>`;}
      else res='você se defendeu';
    }
    lines.push(`${esc(foe.name)} ${dice(r)}+${foe.hab} = <b>${fb}</b> → ${res}`);
  });
  lines.push(`Você ${dice(a)}+${S.char.hab}${B?(B>0?'+':'−')+Math.abs(B):''} = <b>${fa}</b>`);
  f.last=hit?'hit':(hurt?'hurt':null);
  f.log.unshift(lines.join('<br>'));
  settle();
}
function luckInFight(){
  const s=book.secs[S.sec],f=S.fight,foe=s.groups[f.g].foes[f.target],L=testLuck();
  let t;
  if(f.last==='hit'){ if(L.ok){f.hp[f.g][f.target]-=2;t=`<span class="res-ok">Sorte! Ferimento sério em ${esc(foe.name)} (−2 extra).</span>`;} else {f.hp[f.g][f.target]+=1;t=`<span class="res-bad">Azar. Foi só um arranhão (${esc(foe.name)} recupera 1).</span>`;} }
  else { if(L.ok){S.char.ene+=1;t='<span class="res-ok">Sorte! Você evitou parte do golpe (+1 Energia).</span>';} else {S.char.ene-=1;t='<span class="res-bad">Azar. O golpe foi mais sério (−1 Energia).</span>';} }
  f.log.unshift(`Testar a Sorte ${dice(L.r)} = <b>${L.sum}</b> contra ${L.target}${L.auto?' (Sorte 1 ou menos: azar automático)':''}<br>${t}`);
  f.last=null; settle();
}
function settle(){
  const s=book.secs[S.sec],f=S.fight; clamp(S.char);
  if(S.char.ene<=0){S.dead=true;render();return;}
  const G=s.groups[f.g],hp=f.hp[f.g];
  if(hp[f.target]<=0){
    f.log.unshift(`<b>${esc(G.foes[f.target].name)} foi derrotado.</b>`); f.last=null;
    const next=hp.findIndex(h=>h>0);
    if(next>=0) f.target=next;
    else if(G.to) f.goto=G.to;
    else {f.g++;f.target=0;if(f.g>=s.groups.length)f.done=true;}
  }
  render();
}
function flee(){S.char.ene-=2;clamp(S.char);if(S.char.ene<=0){S.dead=true;render();return;}enter(book.secs[S.sec].flee);}
function runTest(idx){
  const t=book.secs[S.sec].tests[idx]; let res;
  if(t.kind==='sor') res=testLuck();
  else {const r=[d6(),d6()],sum=r[0]+r[1],target=S.char[t.kind]||0;res={r,sum,target,ok:sum<=target};}
  res.to=res.ok?t.ok:t.fail; S.tests[idx]=res; render();
}

          <dt>combate: Lobo | 7 | 6
combate: Ogro | 9 | 10 -> 80</dt><dd>Nome | Habilidade | Energia. Linhas separadas são lutas uma depois da outra. Com <code>-> 80</code>, vencer leva à seção 80; sem isso, as escolhas aparecem depois da vitória.</dd>
          <dt>combate: Bandido | 7 | 6
combate junto: Bandido | 6 | 5</dt><dd>Criaturas que atacam ao mesmo tempo. Você escolhe o alvo; as outras também rolam contra você, e você só se defende delas.</dd>
          <dt>fuga -> 15</dt><dd>Permite fugir do combate (custa 2 de Energia).</dd>
          <dt>teste de sorte: 40 | 50
teste de habilidade: 40 | 50
teste de fé: 40 | 50</dt><dd>Rola 2 dados contra o atributo. Passou vai para 40, falhou vai para 50.</dd>
          <dt>fim: Você venceu!</dt><dd>Final da história, com mensagem.</dd>
          <dt>*itálico*  **negrito**</dt><dd>Linha em branco separa parágrafos.</dd>
        </dl>
      </section>
    </div>
  </div>`;
  $('#src').value=src;
  renderCheck();
}
function renderCheck(){
  const el=$('#check'); if(!el) return;
  const probs=check(book), n=book.order.length;
  const ends=book.order.filter(id=>book.secs[id].end).length;
  const fights=book.order.reduce((a,id)=>a+book.secs[id].groups.reduce((x,g)=>x+g.foes.length,0),0);
  el.innerHTML=`<div class="counts">${n} ${n===1?'seção':'seções'} · ${ends} ${ends===1?'final':'finais'} · ${fights} ${fights===1?'criatura':'criaturas'}</div>`+
    (probs.length?`<ul class="problems">${probs.map(p=>`<li class="${p.err?'err':''}">${esc(p.msg)}</li>`).join('')}</ul>`:`<p class="check-ok" style="margin:0">Todos os números levam a seções que existem.</p>`);
}
function status(t){const el=$('#status');if(el)el.textContent=t;}

/* ---------- Eventos ---------- */
let resetArmed=0, timer=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==='music'){const st=Music.toggle();b.setAttribute('aria-pressed',String(st));b.querySelector('span').textContent=st?'Desligar música':'Ligar música';if(!st&&!Music.on&&!(window.AudioContext||window.webkitAudioContext))b.querySelector('span').textContent='Sem áudio neste navegador';return;}
  if(a==='view'){view=b.dataset.v;if(view==='play')book=parse(src);render();}
  else if(a==='continue'){if(saved){S=saved.S;notesText=saved.notesText||'';saved=null;render();window.scrollTo({top:0});}}
  else if(a==='roll'){rollChar();render();}
  else if(a==='begin'){S.visited=[];enter(book.order[0]);}
  else if(a==='go'){enter(b.dataset.to);}
  else if(a==='attack'){attack();}
  else if(a==='fluck'){luckInFight();}
  else if(a==='flee'){flee();}
  else if(a==='test'){runTest(+b.dataset.i);}
  else if(a==='eat'){eat();}
  else if(a==='drink'){drink();}
  else if(a==='pocao'){if(S.char){S.char.pocao={tipo:b.dataset.p,doses:1};render();}}
  else if(a==='restart'){
    const inGame=S.phase==='play'&&!S.dead&&!(book.secs[S.sec]&&book.secs[S.sec].end);
    if(inGame&&b.id==='btn-restart'&&resetArmed!=='restart'){resetArmed='restart';b.textContent='Clique de novo para apagar o progresso';setTimeout(()=>{if(resetArmed==='restart')resetArmed=0;const x=$('#btn-restart');if(x)x.textContent='Recomeçar do zero';},5000);return;}
    resetArmed=0;S=freshState();lastSnap='';saved=null;try{localStorage.removeItem(SAVE)}catch(e){}apagarNuvem();render();window.scrollTo({top:0});
  }
  else if(a==='jump'){const v=($('#pular').value||'').trim();if(!v)return;if(!S.char)rollChar();S.dead=false;enter(v);}
  else if(a==='playnow'){book=parse(src);S=freshState();view='play';render();window.scrollTo({top:0});}
  else if(a==='open'){$('#arquivo').click();}
  else if(a==='copy'){
    const ta=$('#src');
    const fallback=()=>{ta.focus();ta.select();status('Texto selecionado. Use Ctrl+C (ou Copiar no celular).');};
    try{navigator.clipboard.writeText(src).then(()=>status('Texto copiado. Cole num arquivo .txt para guardar.'),fallback);}catch(err){fallback();}
  }
  else if(a==='load'){
    const w=b.dataset.which, txt=w==='aventura'?aventura:exemplo, label=w==='aventura'?'Carregar O Castelo de Vargrav':'Carregar exemplo curto';
    if(src===txt){status('Esse texto já está no editor.');return;}
    if(resetArmed===w){src=txt;store.set(KEY,src);book=parse(src);S=freshState();renderEditor();status(w==='aventura'?'O Castelo de Vargrav carregado.':'Exemplo curto carregado.');resetArmed=0;}
    else{resetArmed=w;b.textContent='Clique de novo: isso substitui o texto atual';setTimeout(()=>{if(resetArmed===w)resetArmed=0;const x=document.querySelector(`[data-which="${w}"]`);if(x)x.textContent=label;},5000);}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='alvo'&&S.fight){S.fight.target=+e.target.value;S.fight.last=null;render();}});
document.addEventListener('input',e=>{
  if(e.target.id==='src'){src=e.target.value;clearTimeout(timer);timer=setTimeout(()=>{store.set(KEY,src);book=parse(src);renderCheck();status('Salvo neste navegador.');},350);}
  if(e.target.id==='volume'){Music.volume(+e.target.value/100);store.set('livrojogo.volume',e.target.value);}
  if(e.target.id==='anotacoes'){notesText=e.target.value;store.set(NKEY,notesText);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pular'){e.preventDefault();document.querySelector('[data-act="jump"]').click();}});
$('#arquivo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{src=String(r.result);store.set(KEY,src);book=parse(src);S=freshState();view='edit';render();status(`Arquivo "${f.name}" aberto.`);};
  r.readAsText(f,'utf-8'); e.target.value='';
});

book=parse(src);
S=freshState();
let saved=null;
try{const j=JSON.parse(store.get(SAVE)||'null');if(validSave(j))saved=j;}catch(e){}
{const v=store.get('livrojogo.volume');if(v!=null){$('#volume').value=v;Music.volume(+v/100);}}
render();
iniciarConta();
})();
</script>
