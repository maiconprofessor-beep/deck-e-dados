<script type="text/plain" id="aventura">
Título: O Castelo de Vargrav
Autor: Maicon Kuzer
Habilidade: 1d6+6
Energia: 2d6+12
Sorte: 1d6+6
Fé: 1d6+3
Equipamento: Espada, Armadura de couro, Lanterna
Provisões: 10
Ouro: 10

O inverno chegou cedo ao vale de Kessel. Você subiu as montanhas atrás de trabalho para a sua espada, mas a diligência o deixa em Dravna, um vilarejo de casas de pedra encolhidas sob a neve. No alto do penhasco, acima das nuvens baixas, as torres negras do Castelo de Vargrav parecem vigiar cada telhado.

A estalagem se chama O Sino Calado. Ninguém ri, ninguém canta, e quando você entra todas as conversas morrem. O estalajadeiro serve sopa sem dizer palavra. Só depois do terceiro copo de vinho quente um rapaz de mãos calejadas se senta à sua frente.

"Ela levou Mirela", ele diz, baixinho. "Nossa curandeira. Anteontem à noite veio a carruagem sem cocheiro, puxada por cavalos brancos de olhos vermelhos. Ninguém teve coragem de sair."

Ela é a Baronesa Isolde Vargrav. Os velhos dizem que governa o vale há trezentos anos e nunca envelheceu um dia. A cada inverno, alguém some. Ninguém voltou.

O padre do vilarejo, um homem magro chamado Ivo, se aproxima da mesa. "O senhor tem cara de quem já enfrentou coisas piores que lobos. Não temos muito, mas o que tivermos é seu. Traga Mirela de volta. E se puder... ponha fim a isso."

Você aceita. Durma bem esta noite, porque amanhã começa a subida.

## 1
Você acorda com o sino da capela tocando uma única vez, abafado pela neve. Dravna amanhece cinzenta. O dia é curto nas montanhas, e a estrada até o castelo leva quase o dia inteiro. Antes de partir, você pode se preparar no vilarejo.
-> 166 Sair para a praça e se preparar
-> 346 Partir imediatamente para o castelo

## 2
Liesl é rápida e desesperada.
combate: Liesl, a Noiva | 9 | 10
-> 168 Ver o que aconteceu

## 3
Você está num corredor estreito de celas, iluminado por tochas fracas. As portas são de madeira grossa com janelinhas gradeadas e têm números pintados: um, dois e três. No fim do corredor há uma porta maior, com um cheiro de ferro e queimado. Um vulto arrastando os pés faz a ronda com um molho de chaves na cintura.
-> 391 Enfrentar o vulto
-> 23 Esconder-se num vão e esperar ele passar
-> 381 Espiar a cela um
-> 217 Espiar a cela dois
-> 57 Espiar a cela três

## 4
A maioria dos vidros guarda chás comuns. Mas num canto há um maço de flores azuis secas com um rótulo cuidadoso: "Acônito. Contra a febre do lobo. Uma pitada na língua." Você guarda um punhado. Também encontra um bálsamo para feridas e o aplica nos dedos rachados de frio.
ganha: Acônito Seco
energia: +1
-> 52 Continuar procurando

## 5
Você avança sobre o mordomo. Os convidados fantasmas se levantam e se desfazem, e Ansgar tira da casaca uma faca longa e fina.
-> 51 Lutar

## 6
O vinho virou quase vinagre, mas ainda aquece. Você bebe um pouco.
energia: +2
-> 158 Continuar

## 7
O gelo estala sob suas botas.
teste de sorte: 313 | 302

## 8
Liesl treme, lutando contra a fome. "Vá embora. Por favor." Mas o corpo dela não obedece. Ela salta em sua direção.
teste de fé: 91 | 2

## 9
Você chega a uma capela subterrânea de abóbadas baixas. As paredes são cobertas de afrescos de anjos e cavaleiros, e uma luz azul e suave vem de lugar nenhum. No centro, sobre um túmulo de mármore branco, jaz a estátua de um cavaleiro com as mãos cruzadas sobre o cabo de uma espada de prata. A espada é de verdade.
-> 242 [!Espada Aurora] Aproximar-se do túmulo
-> 87 Examinar o altar
-> 244 Voltar por onde veio

## 10
O homem embrulha pão, queijo duro e tiras de carne seca. Dá para três refeições.
-> 271 [ouro 2+] Pagar 2 moedas
-> 392 Desistir

## 11
O estalajadeiro olha para os lados antes de responder. "A carruagem vem pela estrada velha, e às vezes para na encruzilhada da forca, esperando alguém. Quem sobe nela não precisa andar até o castelo." Ele estremece. "Mas também não escolhe onde desce."
anota: Boato da Carruagem
-> 34 Agradecer

## 12
Corvin estica o braço até a prateleira mais próxima e lhe entrega um frasco de líquido vermelho. "Um tônico. É o que eu alcanço. Se encontrar uma chave, volte."
energia: +3
-> 328 Prometer voltar

## 13
Na metade da subida, uma pedra se solta. Você escorrega vários metros antes de se segurar num arbusto. Desiste da escalada e desce até a trilha de cabras.
energia: -3
-> 268 Seguir até o jardim

## 14
As servas não param de cantar, mas seus rostos se viram para você, todos ao mesmo tempo.
-> 327 [Crucifixo] Erguer o crucifixo
-> 129 [Alho] Mostrar o alho
-> 397 Abrir caminho com a espada

## 15
Você avança com a espada. Os cavalos empinam e relincham com vozes que não são de cavalo. Um deles avança com os dentes à mostra.
combate: Cavalo do Castelo | 8 | 9
fuga -> 161
-> 46 Ver o que acontece com a carruagem

## 16
O quarto da Baronesa é luxuoso e gelado. Há uma cama de dossel vermelho que nunca foi usada, uma penteadeira com espelho coberto por um pano preto, um guarda-roupa enorme e, no centro do quarto, sobre um estrado, um caixão de ébano com alças de prata. Está fechado.
-> 269 Abrir o caixão
-> 76 Examinar a penteadeira
-> 395 Abrir o guarda-roupa
-> 58 Olhar pela janela
-> 328 Sair da ala leste

## 17
Com a roseira cortada até o chão, você colhe a última flor. As pétalas pulsam como se tivessem coração. Talvez sirva para alguma coisa; talvez seja melhor não saber.
ganha: Rosa Negra
-> 268 Voltar ao centro do jardim

## 18
Num gancho na parede há um molho de chaves pequenas e uma lamparina. Na mesa, debaixo das cartas, um bilhete: "Troca da guarda à meia-noite. Não abram a ala leste. Ordens do mordomo." A escada da torre desce para o interior do castelo.
ganha: Chaves da Guarda
-> 186 Descer a escada da torre

## 19
O ossuário é uma sala abobadada onde milhares de crânios estão empilhados nas paredes, formando desenhos de flores e cruzes. Um brilho de fungos verdes ilumina o lugar. Três passagens saem daqui: uma com degraus que sobem, uma que desce em rampa e uma porta de ferro com uma pequena janela gradeada.

(function(){

  const AC=window.AudioContext||window.webkitAudioContext;

  function impulse(sec){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}

/* ---------- Leitor do formato ---------- */
const STATKEY={habilidade:'hab',energia:'ene',sorte:'sor','fé':'fe',fe:'fe',ouro:'ouro','provisões':'prov',provisoes:'prov'};
const NAME={hab:'Habilidade',ene:'Energia',sor:'Sorte',fe:'Fé',ouro:'Ouro',prov:'Provisões'};
const sk=w=>STATKEY[w.toLowerCase()];
const W='(habilidade|energia|sorte|f[éÉeE]|ouro|provis[õÕoO]es)';
const RX={
  formula:new RegExp('^'+W+'\\s*:\\s*(\\d+)\\s*d6\\s*(?:\\+\\s*(\\d+))?\\s*$','i'),
  max:new RegExp('^'+W+'\\s+inicial\\s*:\\s*([+-]?\\d+)\\s*$','i'),
  stat:new RegExp('^'+W+'\\s*:\\s*([+-]?\\d+)\\s*$','i'),
  test:new RegExp('^teste\\s+de\\s+(sorte|habilidade|f[éÉeE])\\s*:\\s*(\\d+)\\s*\\|\\s*(\\d+)\\s*$','i'),
  req:new RegExp('^'+W+'\\s+(\\d+)\\s*\\+$','i')
};
function parse(text){
  const b={title:'Sem título',autor:'',intro:[],secs:{},order:[],errors:[],formula:{hab:[1,6],ene:[2,12],sor:[1,6]},equip:[],prov:10,ouro:0,pocoes:[],doses:1,eatRestricted:false};
  let cur=null;
  text.split(/\r?\n/).forEach((raw,i)=>{
    const t=raw.trim(), ln=i+1; let m;
    if(!cur){
      if(m=t.match(/^t[íÍiI]tulo\s*:\s*(.+)$/i)){b.title=m[1];return;}
      if(m=t.match(/^autor\s*:\s*(.+)$/i)){b.autor=m[1].trim();return;}
      if(m=t.match(RX.formula)){b.formula[sk(m[1])]=[+m[2],+(m[3]||0)];return;}
      if(m=t.match(/^doses\s+de\s+po[çÇcC][ãÃaA]o\s*:\s*(\d+)\s*$/i)){b.doses=Math.max(1,+m[1]);return;}
      if(/^comer\s*:/i.test(t)){b.eatRestricted=true;return;}
      if(m=t.match(/^po[çÇcC][õÕoO]es\s*:\s*(.+)$/i)){b.pocoes=m[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);return;}
      if(m=t.match(/^equipamento\s*:\s*(.+)$/i)){b.equip=m[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);return;}
      if(m=t.match(/^provis[õÕoO]es\s*:\s*(\d+)\s*$/i)){b.prov=+m[1];return;}
      if(m=t.match(/^ouro\s*:\s*(\d+)\s*$/i)){b.ouro=+m[1];return;}
    }
    if(m=t.match(/^#+\s*(\d+)\s*$/)){
      if(b.secs[m[1]]) b.errors.push(`Seção ${m[1]} aparece duas vezes (linha ${ln}).`);
      cur={id:m[1],canEat:false,lines:[],choices:[],effects:[],groups:[],tests:[],flee:null,end:null};
      b.secs[m[1]]=cur;b.order.push(m[1]);return;
    }
    if(!cur){b.intro.push(raw);return;}
    if(m=t.match(/^->\s*(\d+)\s*((?:\[[^\]]+\]\s*)*)(.*)$/)){const reqs=[...m[2].matchAll(/\[([^\]]+)\]/g)].map(x=>x[1].trim());cur.choices.push({to:m[1],reqs,label:m[3].trim()||('Vá para '+m[1])});return;}
    if(/^->/.test(t)){b.errors.push(`Linha ${ln}: escolha sem número de destino.`);return;}
    if(m=t.match(/^combate(\s+junto|\s*\+)?\s*:\s*(.+?)\s*\|\s*(\d+)\s*\|\s*(\d+)\s*(?:->\s*(\d+))?\s*$/i)){
      const foe={name:m[2],hab:+m[3],ene:+m[4]};
      let g; if(m[1]&&cur.groups.length){g=cur.groups[cur.groups.length-1];g.foes.push(foe);} else {g={foes:[foe],to:null};cur.groups.push(g);}
      if(m[5]) g.to=m[5]; return;
    }
    if(/^combate/i.test(t)&&/:/.test(t)){b.errors.push(`Linha ${ln}: combate fora do formato "Nome | HAB | ENE".`);return;}
    if(/^pode\s+comer\s*$/i.test(t)){cur.canEat=true;return;}
    if(m=t.match(/^fuga\s*->\s*(\d+)\s*$/i)){cur.flee=m[1];return;}
    if(m=t.match(RX.test)){cur.tests.push({kind:sk(m[1]),ok:m[2],fail:m[3]});return;}
    if(m=t.match(/^(ganha|perde)\s*:\s*(.+)$/i)){cur.effects.push({type:m[1].toLowerCase(),item:m[2].trim()});return;}
    if(m=t.match(/^arma\s*:\s*(.+?)\s*(?:\|\s*([+-]?\d+))?\s*$/i)){cur.effects.push({type:'arma',item:m[1],n:+(m[2]||0)});return;}
    if(m=t.match(/^afli[çÇcC][ãÃaA]o\s*:\s*(.+)$/i)){cur.effects.push({type:'afl',item:m[1].trim()});return;}
    if(m=t.match(/^cura\s*:\s*(.+)$/i)){cur.effects.push({type:'cura',item:m[1].trim()});return;}
    if(m=t.match(/^anota\s*:\s*(.+)$/i)){cur.effects.push({type:'anota',item:m[1].trim()});return;}
    if(m=t.match(RX.max)){cur.effects.push({type:'max',stat:sk(m[1]),n:+m[2]});return;}
    if(m=t.match(RX.stat)){cur.effects.push({type:'stat',stat:sk(m[1]),n:+m[2]});return;}
    if(m=t.match(/^fim\s*(?::\s*(.*))?$/i)){cur.end=(m[1]||'').trim()||'Fim da aventura.';return;}
    cur.lines.push(raw);
  });
  return b;
}
function targets(s){return [...s.choices.map(c=>c.to),...s.groups.map(g=>g.to).filter(Boolean),...(s.flee?[s.flee]:[]),...s.tests.flatMap(t=>[t.ok,t.fail])];}
function check(b){
  const probs=b.errors.map(e=>({err:true,msg:e}));
  if(!b.order.length){probs.push({err:true,msg:'Nenhuma seção encontrada. Comece uma com "## 1".'});return probs;}
  b.order.forEach(id=>{const s=b.secs[id];
    targets(s).forEach(t=>{if(!b.secs[t])probs.push({err:true,msg:`Seção ${id} manda para ${t}, que não existe.`});});
    s.tests.forEach(t=>{if(t.kind==='fe'&&!b.formula.fe)probs.push({err:true,msg:`Seção ${id} testa a Fé, mas o cabeçalho não tem "Fé: 1d6+3".`});});
    if(!s.end && !s.choices.length && !s.tests.length && !s.groups.some(g=>g.to)) probs.push({err:false,msg:`Seção ${id} não tem saída nem "fim".`});
  });
  const seen=new Set([b.order[0]]),q=[b.order[0]];
  while(q.length){const s=b.secs[q.shift()];targets(s).forEach(t=>{if(b.secs[t]&&!seen.has(t)){seen.add(t);q.push(t);}});}
  const orphan=b.order.filter(id=>!seen.has(id));
  if(orphan.length) probs.push({err:false,msg:`Ninguém chega a: ${orphan.join(', ')}.`});
  return probs;
}

function freshState(){return {phase:'start',char:null,roll:null,sec:null,visited:[],fight:null,tests:{},notes:[],dead:false};}

const lc=s=>s.toLowerCase();
const has=n=>[S.char.items,S.char.afl,S.char.flags].some(L=>L.some(i=>lc(i)===lc(n)));
function reqOk(req){
  if(!req) return true; let m;

const bestWeapon=()=>{let n=null,b=-99;for(const [k,v] of Object.entries(S.char.weapons)){if(v>b){b=v;n=k;}}return n;};
function clamp(c){
  ['hab','ene','sor'].forEach(k=>{c[k]=Math.max(0,Math.min(c[k],c[k+'Max']));});
  if(c.fe!=null) c.fe=Math.max(0,c.fe);

function enter(id){

    else if(f.type==='afl'){if(!c.afl.some(i=>lc(i)===lc(f.item)))c.afl.push(f.item);S.notes.push({cls:'bad',t:'Aflição: '+f.item});}

  });

const dice=a=>a.map(n=>`<span class="die">${n}</span>`).join('');
function testLuck(){
  const r=[d6(),d6()],sum=r[0]+r[1],before=S.char.sor;
  const ok=before>1&&sum<=before; S.char.sor=Math.max(0,before-1);
  return {r,sum,target:before,ok,auto:before<=1};
}

function attack(){
  const s=book.secs[S.sec],f=S.fight,G=s.groups[f.g],hp=f.hp[f.g];
  const a=[d6(),d6()],B=bonus(),fa=a[0]+a[1]+S.char.hab+B;
  let hit=false,hurt=false;
  const lines=[];
  G.foes.forEach((foe,i)=>{
    if(hp[i]<=0) return;
    const r=[d6(),d6()],fb=r[0]+r[1]+foe.hab; let res;
    if(i===f.target){
      if(fa>fb){hp[i]-=2;hit=true;res=`<span class="res-ok">você feriu (−2)</span>`;}
      else if(fb>fa){S.char.ene-=2;hurt=true;res=`<span class="res-bad">feriu você (−2)</span>`;}
      else res='golpes evitados';
    } else {
      if(fb>fa){S.char.ene-=2;hurt=true;res=`<span class="res-bad">feriu você (−2)</span>`;}
      else res='você se defendeu';
    }
    lines.push(`${esc(foe.name)} ${dice(r)}+${foe.hab} = <b>${fb}</b> → ${res}`);
  });
  lines.push(`Você ${dice(a)}+${S.char.hab}${B?(B>0?'+':'−')+Math.abs(B):''} = <b>${fa}</b>`);
  f.last=hit?'hit':(hurt?'hurt':null);

}
function luckInFight(){

  else { if(L.ok){S.char.ene+=1;t='<span class="res-ok">Sorte! Você evitou parte do golpe (+1 Energia).</span>';} else {S.char.ene-=1;t='<span class="res-bad">Azar. O golpe foi mais sério (−1 Energia).</span>';} }
  f.log.unshift(`Testar a Sorte ${dice(L.r)} = <b>${L.sum}</b> contra ${L.target}${L.auto?' (Sorte 1 ou menos: azar automático)':''}<br>${t}`);

function settle(){
  const s=book.secs[S.sec],f=S.fight; clamp(S.char);
  if(S.char.ene<=0){S.dead=true;render();return;}

    const local=saved, remoto=row&&validSave(row.estado)?row.estado:null;
    const tLocal=local&&local.salvo_em?Date.parse(local.salvo_em):0, tRemoto=remoto&&remoto.salvo_em?Date.parse(remoto.salvo_em):0;
    if(remoto&&tRemoto>=tLocal) saved=remoto;
    else if(local&&S.phase!=='play') pushNuvem(local);
    if(S.phase==='play'&&lastSnap) pushNuvem(snapshot());
  }catch(e){ nuvem='erro'; }
  if(S.phase!=='play') render(); else paintSave();
}
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.v===view)));
  if(view==='edit') renderEditor(); else renderPlay();
  const f=S&&S.fight, s=S&&S.sec&&book.secs[S.sec];
  Music.setCombat(view==='play'&&!!f&&!f.done&&!f.goto&&!S.dead);
  const endKey=S.dead?'morte:'+S.visited.length:(s&&s.end&&view==='play'?'fim:'+S.sec+':'+S.visited.length:'');
  if(endKey&&endKey!==lastEnd){ if(S.dead) Music.sting(); else Music.fanfare(); }
  lastEnd=endKey;
  save();
  paintSave();
}
function formulaText(k){const f=book.formula[k];return `${f[0]} ${f[0]===1?'dado':'dados'}${f[1]?' + '+f[1]:''}`;}

function sheetHTML(){
  const c=S.char;
  if(!c) return `<aside class="sheet"><h2>Folha de Aventuras</h2><p class="empty">Role os atributos para preencher a ficha.</p></aside>`;
  const pct=c.eneMax?Math.round(c.ene/c.eneMax*100):0;
  const inFight=S.fight&&!S.fight.done&&!S.fight.goto;
  const w=bestWeapon();
  const statRow=k=>c[k]==null?'':`<div class="stat"><span class="k">${NAME[k]}</span><span class="val">${c[k]}<small>/${c[k+'Max']}</small></span>${k==='ene'?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div>`;
  return `<aside class="sheet"><h2>Folha de Aventuras</h2>
    ${STATS.map(statRow).join('')}
    <div class="stat"><span class="k">Ouro</span><span class="val">${c.ouro}</span></div>
    <div class="stat"><span class="k">Provisões</span><span class="val">${c.prov}</span></div>
    ${c.pocao?`<div class="stat"><span class="k">${esc(pocaoInfo(c.pocao.tipo).nome)}</span><span class="val">${c.pocao.doses}<small> ${c.pocao.doses===1?'dose':'doses'}</small></span></div>`:''}
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="eat" ${c.prov<1||c.ene>=c.eneMax||inFight||S.dead||!canEatHere()?'disabled':''} title="${book.eatRestricted?'Só nos pontos de descanso indicados no texto':''}">Comer provisão (+4 Energia)</button>${c.pocao?`<button class="btn small" data-act="drink" ${c.pocao.doses<1||inFight||S.dead||S.phase!=='play'?'disabled':''}>Beber poção</button>`:''}</div>
    ${w?`<h4>Arma em uso</h4><div>${esc(w)} <span class="items b">(${c.weapons[w]>=0?'+':'−'}${Math.abs(c.weapons[w])} no ataque)</span></div>`:''}
    <h4>Equipamento e tesouros</h4>
    ${c.items.length?`<ul class="items">${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:'<p class="empty">Nada na mochila.</p>'}
    <h4>Pistas e acontecimentos</h4>
    ${c.flags.length?`<ul class="items">${c.flags.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:'<p class="empty">Nenhuma ainda.</p>'}
    <h4>Aflições</h4>
    ${c.afl.length?`<ul class="items afl">${c.afl.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:'<p class="empty">Nenhuma.</p>'}
    <h4>Caminho</h4>
    <div class="trail">${S.visited.length?S.visited.join(' → '):'—'}</div>
    <h4><label for="anotacoes">Anotações</label></h4>
    <textarea id="anotacoes" placeholder="Senhas, pistas, números que valem a pena lembrar…">${esc(notesText)}</textarea>
  </aside>`;
}

function fightHTML(s){
  const f=S.fight, fighting=!f.done&&!f.goto;
  let rows='';
  s.groups.forEach((G,g)=>{
    if(s.groups.length>1||G.foes.length>1) rows+=`<tr class="grp"><td colspan="3">${s.groups.length>1?'Luta '+(g+1):'Luta'}${G.foes.length>1?' · todos juntos':''}</td></tr>`;
    G.foes.forEach((foe,i)=>{
      const hp=f.hp[g][i], down=hp<=0, isNow=fighting&&g===f.g, tgt=isNow&&i===f.target&&G.foes.length>1;
      rows+=`<tr class="${down?'down':(isNow?'now':(g>f.g?'later':''))}"><td>${esc(foe.name)}${tgt?'<span class="tag">alvo</span>':''}</td><td class="num">${foe.hab}</td><td class="num">${Math.max(0,hp)}</td></tr>`;
    });
  });
  const G=s.groups[Math.min(f.g,s.groups.length-1)], alive=f.hp[Math.min(f.g,s.groups.length-1)].map((h,i)=>h>0?i:-1).filter(i=>i>=0);
  const sel=fighting&&alive.length>1?`<div class="target"><label for="alvo">Atacar:</label><select id="alvo">${alive.map(i=>`<option value="${i}" ${i===f.target?'selected':''}>${esc(G.foes[i].name)}</option>`).join('')}</select><span class="eyebrow">os outros também atacam você</span></div>`:'';
  return `<section class="panel"><h3>Combate</h3>
    <div class="tablewrap"><table class="foes"><thead><tr><th>Criatura</th><th class="num">Habilidade</th><th class="num">Energia</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${sel}
    ${f.log.length?`<div class="log">${f.log.slice(0,4).map(l=>`<div>${l}</div>`).join('')}</div>`:''}
    ${S.dead?'':fighting?`<div class="row">
      <button class="btn primary" data-act="attack">Atacar (rolar dados)</button>
      <button class="btn" data-act="fluck" ${f.last&&S.char.sor>0?'':'disabled'}>Testar a Sorte ${f.last==='hit'?'(ferir mais)':f.last==='hurt'?'(reduzir ferimento)':''}</button>
      ${s.flee?`<button class="btn" data-act="flee">Fugir para ${esc(s.flee)} (−2 Energia)</button>`:''}
    </div>`:f.goto?`<div class="row"><button class="btn primary" data-act="go" data-to="${esc(f.goto)}">Vá para ${esc(f.goto)}</button></div>`:'<p class="res-ok" style="margin:0">Vitória. Siga adiante.</p>'}
  </section>`;
}

function renderPlay(){
  let page='';
  if(!book.order.length){
    page=`<p class="eyebrow">Nada para jogar</p><p>A história ainda não tem seções. Volte para <b>Escrever</b> e crie a primeira com <code>## 1</code>.</p>`;
  } else if(S.phase==='start'){
    const r=S.roll, ks=STATS.filter(k=>book.formula[k]);
    page=`<p class="eyebrow">Novo jogo</p><h2 class="book-title">${esc(book.title)}</h2>${book.autor?`<p class="byline">Escrito por <b>${esc(book.autor)}</b></p>`:''}
      <div class="text">${prose(book.intro)}</div>
      <div class="rules"><p>${ks.map(k=>`<b>${NAME[k]}</b> = ${formulaText(k)}`).join(' · ')}</p>
      <p>Você começa com ${book.prov} provisões${book.ouro?` e ${book.ouro} de ouro`:''}${book.equip.length?`, levando ${book.equip.map(esc).join(', ')}`:''}.</p></div>
      ${r?`<div class="rollgrid">${ks.map(k=>`<div class="rollcell"><div class="eyebrow">${NAME[k]}</div><div class="v">${S.char[k]}</div><div class="how">${dice(r[k])}${book.formula[k][1]?' + '+book.formula[k][1]:''}</div></div>`).join('')}</div>`:''}
      ${saved?`<div class="panel"><h3>Aventura em andamento</h3><p style="margin:0 0 12px">Você parou na seção ${esc(saved.S.sec)}, com Energia ${saved.S.char.ene}.</p><button class="btn primary" data-act="continue">Continuar de onde parei</button></div>`:''}
      <p id="savestate" class="savestate"></p>
      ${r&&book.pocoes.length?`<div class="panel"><h3>Escolha uma poção</h3><p style="margin:0 0 12px">Você pode levar uma garrafa, com ${book.doses===1?'uma dose':book.doses+' doses'}. Ela pode ser bebida a qualquer momento, menos durante um combate.</p><div class="choices" style="margin:0">${book.pocoes.map(pp=>`<button class="choice" data-act="pocao" data-p="${esc(pp)}" aria-pressed="${S.char.pocao&&S.char.pocao.tipo===pp}" style="${S.char.pocao&&S.char.pocao.tipo===pp?'border-color:var(--accent);background:var(--accent-soft)':''}"><span class="n">${S.char.pocao&&S.char.pocao.tipo===pp?'✓':'·'}</span><span>${esc(pocaoInfo(pp).nome)}<span class="req">${esc(pocaoInfo(pp).txt)}</span></span></button>`).join('')}</div></div>`:''}
      <div class="row">${r?`<button class="btn primary" data-act="begin" ${book.pocoes.length&&!S.char.pocao?'disabled':''}>Começar na seção ${esc(book.order[0])}</button><button class="btn" data-act="roll">Rolar de novo</button>`:`<button class="btn primary" data-act="roll">Rolar os atributos</button>`}</div>`;
  } else {
    const s=book.secs[S.sec];
    page=`<div class="secnum">${esc(S.sec)}</div>`;
    if(!s){page+=`<p>A seção ${esc(S.sec)} não existe no texto. Confira os números em <b>Escrever</b>.</p>`;}
    else{
      page+=`<div class="text">${prose(s.lines)}</div>`;
      if(book.eatRestricted&&s.canEat&&!S.dead) S.notes=[...S.notes.filter(n=>n.t!=='Você pode comer aqui'),{cls:'good',t:'Você pode comer aqui'}];
      if(S.notes.length) page+=`<div class="notes">${S.notes.map(n=>`<span class="chip ${n.cls}">${esc(n.t)}</span>`).join('')}</div>`;
      const f=S.fight, blocking=f&&(!f.done);
      if(f) page+=fightHTML(s);
      if(!S.dead && !blocking){
        s.tests.forEach((t,i)=>{
          const res=S.tests[i], nm=NAME[t.kind];
          page+=`<section class="panel"><h3>Teste sua ${nm}</h3>`;
          if(!res) page+=`<p style="margin:0 0 12px">Role dois dados. Se o total for igual ou menor que sua ${nm} (${S.char[t.kind]??0}), você passa.${t.kind==='sor'?' Cada teste custa 1 ponto de Sorte, e com Sorte 1 ou menos o resultado é sempre azar.':''}</p><button class="btn primary" data-act="test" data-i="${i}">Rolar 2 dados</button>`;
          else page+=`<div class="log"><div>${dice(res.r)} = <b>${res.sum}</b> contra ${res.target}${res.auto?' (azar automático)':''}<br>${res.ok?'<span class="res-ok">'+(t.kind==='sor'?'Você teve sorte.':'Você conseguiu.')+'</span>':'<span class="res-bad">'+(t.kind==='sor'?'Você foi azarado.':'Você falhou.')+'</span>'}</div></div><button class="btn primary" data-act="go" data-to="${esc(res.to)}">Vá para ${esc(res.to)}</button>`;
          page+=`</section>`;
        });
        if(s.choices.length) page+=`<ul class="choices">${s.choices.map(c=>{
          const ok=c.reqs.every(reqOk);
          return `<li><button class="choice" data-act="go" data-to="${esc(c.to)}" ${ok?'':'disabled'}><span class="n">${esc(c.to)}</span><span>${esc(c.label)}${(t=>t?`<span class="req">${esc(t)}</span>`:'')(c.reqs.filter(r=>!(r.startsWith('!')&&reqOk(r))).map(r=>reqText(r,reqOk(r))).join(' · '))}</span></button></li>`;}).join('')}</ul>`;
        if(s.end) page+=`<div class="endcard"><p class="big">Fim</p><p>${esc(s.end)}</p><button class="btn primary" data-act="restart">Jogar de novo</button></div>`;
      }
      if(S.dead) page+=`<div class="endcard"><p class="big">Sua Energia chegou a zero</p><p>A aventura termina aqui. Role novos atributos e tente outro caminho.</p><button class="btn primary" data-act="restart">Jogar de novo</button></div>`;
    }
    page+=`<div class="authorbar row"><button class="btn small" data-act="restart" id="btn-restart">Recomeçar do zero</button><span id="savestate" class="savestate"></span></div>`;
  }
  app.innerHTML=`<div class="play"><div class="page">${page}</div>${sheetHTML()}</div>`;
}

function renderEditor(){
  app.innerHTML=`<div class="editor">
    <div class="ed-main">
      <div class="row">
        <button class="btn primary" data-act="playnow">Jogar esta história</button>
        <button class="btn" data-act="copy">Copiar texto</button>
        <button class="btn" data-act="open">Abrir arquivo .txt</button>
        <button class="btn" data-act="load" data-which="aventura">Carregar O Castelo de Vargrav</button>

      </div>

function renderCheck(){
  const el=$('#check'); if(!el) return;
  const probs=check(book), n=book.order.length;
  const ends=book.order.filter(id=>book.secs[id].end).length;
  const fights=book.order.reduce((a,id)=>a+book.secs[id].groups.reduce((x,g)=>x+g.foes.length,0),0);
  el.innerHTML=`<div class="counts">${n} ${n===1?'seção':'seções'} · ${ends} ${ends===1?'final':'finais'} · ${fights} ${fights===1?'criatura':'criaturas'}</div>`+
    (probs.length?`<ul class="problems">${probs.map(p=>`<li class="${p.err?'err':''}">${esc(p.msg)}</li>`).join('')}</ul>`:`<p class="check-ok" style="margin:0">Todos os números levam a seções que existem.</p>`);
}
function status(t){const el=$('#status');if(el)el.textContent=t;}

/* ---------- Eventos ---------- */
let resetArmed=0, timer=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==='music'){const st=Music.toggle();b.setAttribute('aria-pressed',String(st));b.querySelector('span').textContent=st?'Desligar música':'Ligar música';if(!st&&!Music.on&&!(window.AudioContext||window.webkitAudioContext))b.querySelector('span').textContent='Sem áudio neste navegador';return;}
  if(a==='view'){view=b.dataset.v;if(view==='play')book=parse(src);render();}
  else if(a==='continue'){if(saved){S=saved.S;notesText=saved.notesText||'';saved=null;render();window.scrollTo({top:0});}}
  else if(a==='roll'){rollChar();render();}
  else if(a==='begin'){S.visited=[];enter(book.order[0]);}
  else if(a==='go'){enter(b.dataset.to);}
  else if(a==='attack'){attack();}
  else if(a==='fluck'){luckInFight();}
  else if(a==='flee'){flee();}
  else if(a==='test'){runTest(+b.dataset.i);}
  else if(a==='eat'){eat();}
  else if(a==='drink'){drink();}
  else if(a==='pocao'){if(S.char){S.char.pocao={tipo:b.dataset.p,doses:book.doses};render();}}
  else if(a==='restart'){
    const inGame=S.phase==='play'&&!S.dead&&!(book.secs[S.sec]&&book.secs[S.sec].end);
    if(inGame&&b.id==='btn-restart'&&resetArmed!=='restart'){resetArmed='restart';b.textContent='Clique de novo para apagar o progresso';setTimeout(()=>{if(resetArmed==='restart')resetArmed=0;const x=$('#btn-restart');if(x)x.textContent='Recomeçar do zero';},5000);return;}
    resetArmed=0;S=freshState();lastSnap='';saved=null;try{localStorage.removeItem(SAVE)}catch(e){}apagarNuvem();render();window.scrollTo({top:0});
  }
  else if(a==='jump'){const v=($('#pular').value||'').trim();if(!v)return;if(!S.char)rollChar();S.dead=false;enter(v);}
  else if(a==='playnow'){book=parse(src);S=freshState();view='play';render();window.scrollTo({top:0});}
  else if(a==='open'){$('#arquivo').click();}
  else if(a==='copy'){
    const ta=$('#src');
    const fallback=()=>{ta.focus();ta.select();status('Texto selecionado. Use Ctrl+C (ou Copiar no celular).');};
    try{navigator.clipboard.writeText(src).then(()=>status('Texto copiado. Cole num arquivo .txt para guardar.'),fallback);}catch(err){fallback();}
  }
  else if(a==='load'){
    const w=b.dataset.which, txt=w==='aventura'?aventura:exemplo, label=w==='aventura'?'Carregar O Castelo de Vargrav':'Carregar exemplo curto';
    if(src===txt){status('Esse texto já está no editor.');return;}
    if(resetArmed===w){src=txt;store.set(KEY,src);book=parse(src);S=freshState();renderEditor();status(w==='aventura'?'O Castelo de Vargrav carregado.':'Exemplo curto carregado.');resetArmed=0;}
    else{resetArmed=w;b.textContent='Clique de novo: isso substitui o texto atual';setTimeout(()=>{if(resetArmed===w)resetArmed=0;const x=document.querySelector(`[data-which="${w}"]`);if(x)x.textContent=label;},5000);}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='alvo'&&S.fight){S.fight.target=+e.target.value;S.fight.last=null;render();}});
document.addEventListener('input',e=>{
  if(e.target.id==='src'){src=e.target.value;clearTimeout(timer);timer=setTimeout(()=>{store.set(KEY,src);book=parse(src);renderCheck();status('Salvo neste navegador.');},350);}
  if(e.target.id==='volume'){Music.volume(+e.target.value/100);store.set('livrojogo.volume',e.target.value);}
  if(e.target.id==='anotacoes'){notesText=e.target.value;store.set(NKEY,notesText);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pular'){e.preventDefault();document.querySelector('[data-act="jump"]').click();}});
$('#arquivo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{src=String(r.result);store.set(KEY,src);book=parse(src);S=freshState();view='edit';render();status(`Arquivo "${f.name}" aberto.`);};
  r.readAsText(f,'utf-8'); e.target.value='';
});

book=parse(src);
S=freshState();
let saved=null;
try{const j=JSON.parse(store.get(SAVE)||'null');if(validSave(j))saved=j;}catch(e){}
{const v=store.get('livrojogo.volume');if(v!=null){$('#volume').value=v;Music.volume(+v/100);}}
render();
iniciarConta();
})();
</script>
